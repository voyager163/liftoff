metadata:
  id: CKV2_LIFTOFF_4
  name: Retain private bootstrap state containers
  category: NETWORKING
  severity: HIGH
definition:
  or:
    - cond_type: attribute
      resource_types: [azapi_resource]
      attribute: type
      operator: not_regex_match
      value: '(?i)^Microsoft\.Storage/storageAccounts/blobServices/containers@'
    - and:
        - cond_type: attribute
          resource_types: [azapi_resource]
          attribute: type
          operator: equals_ignore_case
          value: Microsoft.Storage/storageAccounts/blobServices/containers@2023-05-01
        - cond_type: attribute
          resource_types: [azapi_resource]
          attribute: body.properties.publicAccess
          operator: equals
          value: None
