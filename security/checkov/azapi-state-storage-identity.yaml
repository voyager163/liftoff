metadata:
  id: CKV2_LIFTOFF_3
  name: Retain identity authentication for bootstrap state storage
  category: IAM
  severity: HIGH
definition:
  or:
    - cond_type: attribute
      resource_types: [azapi_resource]
      attribute: type
      operator: not_regex_match
      value: '(?i)^Microsoft\.Storage/storageAccounts@'
    - and:
        - cond_type: attribute
          resource_types: [azapi_resource]
          attribute: type
          operator: equals_ignore_case
          value: Microsoft.Storage/storageAccounts@2023-05-01
        - cond_type: attribute
          resource_types: [azapi_resource]
          attribute: body.properties.allowSharedKeyAccess
          operator: equals
          value: false
        - cond_type: attribute
          resource_types: [azapi_resource]
          attribute: body.properties.defaultToOAuthAuthentication
          operator: equals
          value: true
