metadata:
  id: CKV2_LIFTOFF_7
  name: Retain perimeter-secured private bootstrap storage
  category: NETWORKING
  severity: HIGH
definition:
  or:
    - cond_type: attribute
      resource_types: [azapi_resource]
      attribute: type
      operator: not_regex_match
      value: '(?i)^Microsoft\.Storage/storageAccounts@'
    - and:
        - cond_type: attribute
          resource_types: [azapi_resource]
          attribute: type
          operator: equals_ignore_case
          value: Microsoft.Storage/storageAccounts@2023-05-01
        - cond_type: attribute
          resource_types: [azapi_resource]
          attribute: body.properties.publicNetworkAccess
          operator: equals
          value: SecuredByPerimeter
        - cond_type: attribute
          resource_types: [azapi_resource]
          attribute: body.properties.allowBlobPublicAccess
          operator: equals
          value: false
