# The API: lint and format, tests with coverage, integration tests against
# PostgreSQL and the container image build.
lint:
  name: Lint
  runs-on: ubuntu-latest
  timeout-minutes: 10
  defaults:
    run:
      working-directory: {{liftoff.backendDirectory}}
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        version: "0.13.1"
        enable-cache: true
    - run: uv sync --locked
    - run: uv run ruff check .
    - run: uv run ruff format --check .

test:
  name: Tests
  runs-on: ubuntu-latest
  timeout-minutes: 15
  defaults:
    run:
      working-directory: {{liftoff.backendDirectory}}
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        version: "0.13.1"
        enable-cache: true
    - run: uv sync --locked
    - run: uv run pytest

integration:
  name: Integration tests
  runs-on: ubuntu-latest
  timeout-minutes: 15
  defaults:
    run:
      working-directory: {{liftoff.backendDirectory}}
  services:
    postgres:
      image: postgres:18-trixie@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
      env:
        POSTGRES_DB: app
        POSTGRES_USER: app
        # A throwaway database for this job only; not a secret.
        POSTGRES_PASSWORD: ci-only
      ports:
        - 5432:5432
      options: >-
        --health-cmd "pg_isready -U app -d app"
        --health-interval 5s
        --health-timeout 3s
        --health-retries 20
  env:
    APP_DATABASE_URL: postgresql+psycopg://app:ci-only@localhost:5432/app
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        version: "0.13.1"
        enable-cache: true
    - run: uv sync --locked
    - run: uv run pytest -m integration --no-cov

image:
  name: Container image
  runs-on: ubuntu-latest
  timeout-minutes: 15
  defaults:
    run:
      working-directory: {{liftoff.backendDirectory}}
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Build the image (not published)
      run: docker build --tag api:ci .
