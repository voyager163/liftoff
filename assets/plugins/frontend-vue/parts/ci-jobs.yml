# The frontend: lint, formatting and types, unit tests with coverage, the
# production build, and a browser test of the whole application in Docker
# Compose.
frontend-lint:
  name: Frontend lint and types
  runs-on: ubuntu-latest
  timeout-minutes: 10
  defaults:
    run:
      working-directory: {{liftoff.frontendDirectory}}
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: {{liftoff.frontendPrefix}}.node-version
        cache: npm
        cache-dependency-path: {{liftoff.frontendPrefix}}package-lock.json
    - run: npm ci --no-audit --no-fund
    - run: npm run lint
    - run: npm run typecheck

frontend-test:
  name: Frontend tests and build
  runs-on: ubuntu-latest
  timeout-minutes: 15
  defaults:
    run:
      working-directory: {{liftoff.frontendDirectory}}
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: {{liftoff.frontendPrefix}}.node-version
        cache: npm
        cache-dependency-path: {{liftoff.frontendPrefix}}package-lock.json
    - run: npm ci --no-audit --no-fund
    - run: npm test
    - run: npm run build

frontend-browser:
  name: Frontend browser test
  runs-on: ubuntu-latest
  timeout-minutes: 25
  defaults:
    run:
      working-directory: {{liftoff.frontendDirectory}}
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: {{liftoff.frontendPrefix}}.node-version
        cache: npm
        cache-dependency-path: {{liftoff.frontendPrefix}}package-lock.json
    - run: npm ci --no-audit --no-fund
    - run: npx playwright install --with-deps chromium
    - name: Start the application with Docker Compose
      working-directory: .
      run: |
        # A throwaway database for this job only; not a secret.
        echo "POSTGRES_PASSWORD=ci-only" > .env
        docker compose up --build --wait --wait-timeout 300
    - run: npm run test:e2e
    - name: Show the Compose logs
      if: failure()
      working-directory: .
      run: docker compose logs --no-color
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: failure()
      with:
        name: playwright-report
        path: {{liftoff.frontendPrefix}}playwright-report/
        retention-days: 7
