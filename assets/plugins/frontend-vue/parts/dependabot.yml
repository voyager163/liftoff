- package-ecosystem: npm
  directory: {{liftoff.frontendFromRoot}}
  schedule:
    interval: weekly
  cooldown:
    default-days: 7
  groups:
    frontend:
      patterns: ["*"]

- package-ecosystem: docker
  directory: {{liftoff.frontendFromRoot}}
  schedule:
    interval: weekly
  cooldown:
    default-days: 7
