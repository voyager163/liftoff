# The AI service, reached only by the API, at http://ai-service:8000. It
# publishes no port, and the API does not wait for it: requests that need it
# fail with 502 or 504 while it is down. It answers with the offline test
# model unless .env names a real model and the provider's key.
ai-service:
  build: ./{{liftoff.aiServiceDirectory}}
  environment:
    APP_ENVIRONMENT: local
    APP_MODEL: ${APP_MODEL:-test}
    OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
