# The API on http://127.0.0.1:8000 (docs at /docs). It answers with the
# offline test model unless .env names a real model and the provider's key.
api:
  build: ./{{liftoff.backendDirectory}}
  environment:
    APP_ENVIRONMENT: local
    APP_MODEL: ${APP_MODEL:-test}
    OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  ports:
    - "127.0.0.1:8000:8000"
