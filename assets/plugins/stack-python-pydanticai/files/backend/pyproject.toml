[project]
name = "backend"
version = "0.1.0"
description = "{{liftoff.name}} GenAI API"
requires-python = ">=3.14"
dependencies = [
  "fastapi>=0.143,<1",
  # Only the providers below; add other extras, such as "google", as needed.
  "pydantic-ai-slim[anthropic,openai]>=2.57,<3",
  "pydantic-settings>=2.16,<3",
  "scalar-fastapi>=1.9,<2",
  "uvicorn>=0.54,<1",
]

[project.optional-dependencies]
# Tracing to Langfuse, off unless APP_TRACING=langfuse: uv sync --extra langfuse
langfuse = ["langfuse>=5.0.2,<6"]

[dependency-groups]
dev = [
  "httpx2>=2.13,<3",
  "pytest>=8.4,<10",
  "pytest-cov>=7,<9",
  "ruff>=0.14,<1",
]

[tool.uv]
# An application, not a library: dependencies only, nothing to build or publish.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
  "--strict-markers",
  "--cov=app",
  "--cov-branch",
  "--cov-report=term-missing",
  "--cov-fail-under=80",
]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
