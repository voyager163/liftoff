- package-ecosystem: gomod
  directory: {{liftoff.backendFromRoot}}
  schedule:
    interval: weekly
  cooldown:
    default-days: 7
  groups:
    go:
      patterns: ["*"]

- package-ecosystem: docker
  directory: {{liftoff.backendFromRoot}}
  schedule:
    interval: weekly
  cooldown:
    default-days: 7
