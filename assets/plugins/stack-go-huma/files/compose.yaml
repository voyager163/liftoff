# Local development: PostgreSQL, the migrations and the API.
#   cp .env.example .env    # then set POSTGRES_PASSWORD
#   docker compose up --build
# The API is then on http://127.0.0.1:8000 (docs at /docs).
name: {{liftoff.name}}

services:
  database:
    image: postgres:18-trixie@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example)}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - database:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build: ./backend
    command: ["migrate"]
    environment:
      APP_DATABASE_URL: postgresql://app:${POSTGRES_PASSWORD}@database:5432/app
    depends_on:
      database:
        condition: service_healthy

  api:
    build: ./backend
    environment:
      APP_ENVIRONMENT: local
      APP_DATABASE_URL: postgresql://app:${POSTGRES_PASSWORD}@database:5432/app
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  database:
