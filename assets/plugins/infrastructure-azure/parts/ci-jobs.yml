# The infrastructure: OpenTofu formatting, validation of every root with the
# committed provider locks, and a Checkov scan. Nothing is planned or applied.
infrastructure-validate:
  name: Infrastructure validation
  runs-on: ubuntu-latest
  timeout-minutes: 10
  defaults:
    run:
      working-directory: {{liftoff.infrastructureDirectory}}
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
      with:
        tofu_version: 1.13.2
        tofu_wrapper: false
    - run: tofu fmt -check -recursive
    - name: Validate every root
      run: |
        for root in bootstrap environments/*; do
          echo "::group::$root"
          tofu -chdir="$root" init -backend=false -input=false -lockfile=readonly
          tofu -chdir="$root" validate
          echo "::endgroup::"
        done

infrastructure-scan:
  name: Infrastructure security scan
  runs-on: ubuntu-latest
  timeout-minutes: 10
  defaults:
    run:
      working-directory: {{liftoff.infrastructureDirectory}}
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        version: "0.13.1"
    # Accepted findings are skipped next to the resource, each with its reason.
    - run: uvx --from checkov==3.3.29 checkov --directory . --framework terraform --compact --quiet
