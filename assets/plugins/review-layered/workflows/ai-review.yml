# Managed by Liftoff. Change it through Liftoff rather than by hand.
#
# Verified AI review for medium- and high-risk pull requests, following
# https://claude.dev/blog/solving-code-review-at-anthropic/ : several finder
# passes look for bugs independently, separate verifier runs vote on each
# candidate, and only findings a majority confirms are posted, tagged
# Important, Nit or Pre-existing. Low-risk changes rely on the managed
# reviewer alone. After three rounds the pipeline stops and asks for a rethink.
#
# Agents run {{liftoff.agentHost}} through .github/liftoff/review-agent.sh with
# the {{liftoff.agentSecret}} secret. The workflow runs on pull_request_target,
# so it, the bundled scripts, the skills and the review instructions all come
# from the base branch: a pull request cannot change how it is reviewed or
# reach the secret through this workflow. The pull request's head is checked
# out into pr/ only as files to read; nothing from it is ever run. Agents get
# file-reading tools only, the diff the prepare job wrote and a read-only
# GITHUB_TOKEN. Only the publish job, which runs no agent, can comment on the
# pull request. Pull requests from forks are not reviewed.
name: AI review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  REVIEW_AGENT_CLI: "{{liftoff.agentCli}}"
  LIFTOFF_REVIEW_DIR: ai-review
  LIFTOFF_REVIEW_TREE: pr

jobs:
  prepare:
    name: Plan the review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.plan.outputs.run }}
      stop: ${{ steps.plan.outputs.stop }}
      passes: ${{ steps.plan.outputs.passes }}
      verifiers: ${{ steps.plan.outputs.verifiers }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check out the pull request's head as files to diff, never to run
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          persist-credentials: false
          fetch-depth: 0
      - name: Decide whether to run and write the diff and finder prompts
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LIFTOFF_AGENT_CONFIGURED: ${{ secrets.{{liftoff.agentSecret}} != '' }}
          LIFTOFF_AGENT_SECRET: {{liftoff.agentSecret}}
        run: node .github/liftoff/ai-review.mjs prepare
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.plan.outputs.run == 'true' || steps.plan.outputs.stop == 'true'
        with:
          name: ai-review-plan
          path: ai-review/
          retention-days: 3
          if-no-files-found: error

  find:
    name: Find bugs
    needs: prepare
    # prepare never runs a fork's pull request; checked again here because
    # this job holds the agent's secret.
    if: needs.prepare.outputs.run == 'true' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        pass: ${{ fromJSON(needs.prepare.outputs.passes) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out the pull request's head as files to read, never to run
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ai-review-plan
          path: ai-review/
      - name: Install the review agent
        run: npm install --global "$REVIEW_AGENT_CLI"
      - name: Look for bugs (pass ${{ matrix.pass }})
        env:
          {{liftoff.agentSecret}}: ${{ secrets.{{liftoff.agentSecret}} }}
          LIFTOFF_REVIEW_MODEL: ${{ vars.LIFTOFF_REVIEW_MODEL }}
          PASS: ${{ matrix.pass }}
        run: bash .github/liftoff/review-agent.sh "ai-review/finder-$PASS.md" "ai-review/finders/finder-$PASS.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ai-review-finder-${{ matrix.pass }}
          path: ai-review/finders/
          retention-days: 3
          if-no-files-found: error

  verify:
    name: Verify findings
    needs: [prepare, find]
    if: needs.prepare.outputs.run == 'true' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        run: ${{ fromJSON(needs.prepare.outputs.verifiers) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check out the pull request's head as files to read, never to run
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ai-review-plan
          path: ai-review/
      # merge-multiple puts every pass's file in one folder, whether one pass
      # or several uploaded; with none it downloads nothing.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ai-review-finder-*
          merge-multiple: true
          path: ai-review/finders/
      - name: Gather the candidates
        id: candidates
        run: node .github/liftoff/ai-review.mjs verifier-prompt
      - name: Install the review agent
        if: steps.candidates.outputs.has-candidates == 'true'
        run: npm install --global "$REVIEW_AGENT_CLI"
      - name: Verify each candidate independently (run ${{ matrix.run }})
        if: steps.candidates.outputs.has-candidates == 'true'
        env:
          {{liftoff.agentSecret}}: ${{ secrets.{{liftoff.agentSecret}} }}
          LIFTOFF_REVIEW_MODEL: ${{ vars.LIFTOFF_REVIEW_MODEL }}
          RUN: ${{ matrix.run }}
        run: bash .github/liftoff/review-agent.sh ai-review/verifier.md "ai-review/verifiers/verifier-$RUN.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.candidates.outputs.has-candidates == 'true'
        with:
          name: ai-review-verifier-${{ matrix.run }}
          path: ai-review/verifiers/
          retention-days: 3
          if-no-files-found: error

  publish:
    name: Publish the review
    needs: [prepare, find, verify]
    if: always() && (needs.prepare.outputs.run == 'true' || needs.prepare.outputs.stop == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/liftoff
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ai-review-plan
          path: ai-review/
      # merge-multiple puts every pass's file in one folder, whether one pass
      # or several uploaded; with none it downloads nothing.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ai-review-finder-*
          merge-multiple: true
          path: ai-review/finders/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ai-review-verifier-*
          merge-multiple: true
          path: ai-review/verifiers/
      - name: Vote, plan and post one review
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LIFTOFF_STOP: ${{ needs.prepare.outputs.stop }}
        run: node .github/liftoff/ai-review.mjs publish
