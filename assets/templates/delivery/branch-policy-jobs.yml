branch-policy:
  name: Branch policy
  # Which branches may merge into develop and main (see GOVERNANCE.md), and
  # that a release is a develop commit whose CI passed.
  runs-on: ubuntu-latest
  timeout-minutes: 5
  permissions:
    contents: read
    actions: read
    pull-requests: read
  steps:
    # A run the release workflows started names its pull request instead.
    - name: Find the pull request's base
      id: pr
      if: github.event_name == 'workflow_dispatch' && inputs.pull_request != ''
      env:
        GH_TOKEN: ${{ github.token }}
        PULL_REQUEST: ${{ inputs.pull_request }}
      run: |
        case "$PULL_REQUEST" in
          "" | 0* | *[!0-9]*)
            echo "::error::pull_request must be a pull request number, not \"$PULL_REQUEST\"."
            exit 1
            ;;
        esac
        gh api "repos/$GITHUB_REPOSITORY/pulls/$PULL_REQUEST" --jq '"base=\(.base.sha)"' >> "$GITHUB_OUTPUT"
    # The check from the base branch, never the pull request's own copy.
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        ref: ${{ github.event.pull_request.base.sha || steps.pr.outputs.base || github.sha }}
        sparse-checkout: |
          .github/liftoff
          .github/workflows/01-pr-ci.yml
        sparse-checkout-cone-mode: false
    - name: Check the branch policy
      env:
        GITHUB_TOKEN: ${{ github.token }}
        # Branches that tools open into develop.
        AUTOMATION_BRANCHES: {{liftoff.automation}}
      run: |
        if [ -f .github/liftoff/branch-policy.mjs ]; then
          node .github/liftoff/branch-policy.mjs branch
        elif grep -q branch-policy.mjs .github/workflows/01-pr-ci.yml 2> /dev/null; then
          echo "::error::The base branch's CI runs this check, but its .github/liftoff/branch-policy.mjs is missing."
          exit 1
        else
          # This pull request is the one that adds the checks.
          echo "::notice::The base branch does not have the branch checks yet; they apply to pull requests after this one merges."
        fi

release-lineage:
  name: Release lineage
  # A pull request into main must contain the current main, so merging it
  # leaves exactly the tree CI qualified.
  runs-on: ubuntu-latest
  timeout-minutes: 5
  permissions:
    contents: read
    pull-requests: read
  steps:
    # A run the release workflows started names its pull request instead.
    - name: Find the pull request's base
      id: pr
      if: github.event_name == 'workflow_dispatch' && inputs.pull_request != ''
      env:
        GH_TOKEN: ${{ github.token }}
        PULL_REQUEST: ${{ inputs.pull_request }}
      run: |
        case "$PULL_REQUEST" in
          "" | 0* | *[!0-9]*)
            echo "::error::pull_request must be a pull request number, not \"$PULL_REQUEST\"."
            exit 1
            ;;
        esac
        gh api "repos/$GITHUB_REPOSITORY/pulls/$PULL_REQUEST" --jq '"base=\(.base.sha)"' >> "$GITHUB_OUTPUT"
    # The check from the base branch, never the pull request's own copy.
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        ref: ${{ github.event.pull_request.base.sha || steps.pr.outputs.base || github.sha }}
        sparse-checkout: |
          .github/liftoff
          .github/workflows/01-pr-ci.yml
        sparse-checkout-cone-mode: false
    - name: Check the release lineage
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        if [ -f .github/liftoff/branch-policy.mjs ]; then
          node .github/liftoff/branch-policy.mjs lineage
        elif grep -q branch-policy.mjs .github/workflows/01-pr-ci.yml 2> /dev/null; then
          echo "::error::The base branch's CI runs this check, but its .github/liftoff/branch-policy.mjs is missing."
          exit 1
        else
          # This pull request is the one that adds the checks.
          echo "::notice::The base branch does not have the branch checks yet; they apply to pull requests after this one merges."
        fi
