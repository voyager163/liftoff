# Checks every change: each part of the application with its own checks, and
# a review of new dependencies. Branch rules require one aggregate status,
# ci-gate, which fails unless every job succeeded: skipped, cancelled or
# missing jobs are failures, never passes.
name: CI

on:
  pull_request:
    # Edited too: the branch checks read the description and the base.
    types: [opened, synchronize, reopened, edited]
    branches: [develop, main]
  push:
    branches: [develop, main]
  merge_group:
  workflow_dispatch:
    inputs:
      pull_request:
        description: >-
          The pull request to check, when the release workflows start CI for
          one they opened (GitHub starts no workflows for those)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || inputs.pull_request || github.ref }}
  # Cancel superseded pull request runs only; never a branch or queue run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
{{liftoff.jobs}}
{{liftoff.governanceJobs}}
  dependencies:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      # A run the release workflows started names its pull request instead.
      - name: Find the pull request's commits
        id: pr
        if: github.event_name == 'workflow_dispatch' && inputs.pull_request != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST: ${{ inputs.pull_request }}
        run: |
          case "$PULL_REQUEST" in
            "" | 0* | *[!0-9]*)
              echo "::error::pull_request must be a pull request number, not \"$PULL_REQUEST\"."
              exit 1
              ;;
          esac
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PULL_REQUEST" --jq '"base=\(.base.sha)", "head=\(.head.sha)"' >> "$GITHUB_OUTPUT"
      - name: Explain runs without a pull request
        if: github.event_name != 'pull_request' && steps.pr.outputs.head == ''
        run: echo "Dependencies are reviewed on pull requests; nothing new to review here."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request' || steps.pr.outputs.head != ''
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        if: github.event_name == 'pull_request' || steps.pr.outputs.head != ''
        with:
          fail-on-severity: high
          comment-summary-in-pr: ${{ github.event_name == 'pull_request' && 'on-failure' || 'never' }}
          # Empty on a pull_request event, where the action reads the event.
          base-ref: ${{ steps.pr.outputs.base }}
          head-ref: ${{ steps.pr.outputs.head }}

  ci-gate:
    name: ci-gate
    if: always()
    needs: [{{liftoff.gateNeeds}}]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e '
            const needs = JSON.parse(process.env.RESULTS);
            const names = Object.keys(needs);
            if (names.length === 0) { console.error("no jobs reported"); process.exit(1); }
            let failed = false;
            for (const name of names) {
              const result = needs[name].result;
              console.log(name + ": " + result);
              if (result !== "success") failed = true;
            }
            process.exit(failed ? 1 : 0);
          '
