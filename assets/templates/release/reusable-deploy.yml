# Managed by Liftoff. Change it through Liftoff rather than by hand.
#
# Deploys the images built from one commit to one environment, by digest. It
# checks the environment is set up, verifies each image's build provenance,
# copies the images into the environment's registry, runs the database
# migrations with the new API image, then updates the container apps and
# waits until their new revisions, and the application, are ready. Until
# Azure is set up for the environment it fails, saying what is missing: it
# never reports a deployment that did not happen.
name: Deploy

on:
  workflow_call:
    inputs:
      environment:
        description: The environment to deploy to
        required: true
        type: string
      candidate:
        description: The commit the images were built from
        required: true
        type: string
      expected:
        description: '"name digest" lines the images must match, such as a release manifest''s'
        required: false
        type: string
        default: ""
      only-if-head:
        description: >-
          A branch whose head the candidate must still be; when the branch
          has moved on, the newer commit's own build deploys it instead
        required: false
        type: string
        default: ""
    outputs:
      images:
        description: '"name digest" lines of the images deployed; empty when nothing was'
        value: ${{ jobs.deploy.outputs.images }}

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: ${{ inputs.environment }}
      url: ${{ vars.APP_URL }}
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
      id-token: write
      attestations: read
    outputs:
      images: ${{ steps.images.outputs.images }}
    env:
      ENVIRONMENT: ${{ inputs.environment }}
      CANDIDATE: ${{ inputs.candidate }}
      EXPECTED: ${{ inputs.expected }}
      IMAGES: {{liftoff.imageNames}}
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_CONTAINER_REGISTRY: ${{ vars.AZURE_CONTAINER_REGISTRY }}
      AZURE_API_APP: ${{ vars.AZURE_API_APP }}
      AZURE_WEB_APP: ${{ vars.AZURE_WEB_APP }}
      AZURE_MIGRATE_JOB: ${{ vars.AZURE_MIGRATE_JOB }}
      APP_URL: ${{ vars.APP_URL }}
    steps:
      - name: Check the environment is set up for deployments
        run: |
          missing=()
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AZURE_RESOURCE_GROUP \
            AZURE_CONTAINER_REGISTRY AZURE_API_APP AZURE_MIGRATE_JOB APP_URL{{liftoff.webVariable}}; do
            if [ -z "${!name:-}" ]; then missing+=("$name"); fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Deploy target not configured for ${ENVIRONMENT}: set ${missing[*]} as variables of the ${ENVIRONMENT} environment.{{liftoff.setupGuide}}"
            exit 1
          fi
      # Under the environment's lock, so deployments happen in commit order:
      # a build that finishes after a newer commit's never replaces it.
      - name: Check the candidate is still the latest
        id: current
        if: inputs.only-if-head != ''
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ inputs.only-if-head }}
        run: |
          head=$(gh api "repos/${GITHUB_REPOSITORY}/branches/${BRANCH}" --jq .commit.sha)
          if [ "$head" != "$CANDIDATE" ]; then
            echo "::notice::${BRANCH} has moved on to ${head}, whose build deploys it; ${CANDIDATE} is not deployed."
            echo "superseded=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.current.outputs.superseded != 'true'
        with:
          persist-credentials: false
          sparse-checkout: .github/liftoff
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: steps.current.outputs.superseded != 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Find each image by digest and check how it was built
        id: images
        if: steps.current.outputs.superseded != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          read -ra images <<< "$IMAGES"
          bash .github/liftoff/resolve-images.sh "$CANDIDATE" "${images[@]}" > "$RUNNER_TEMP/images.txt"
          if [ -n "$EXPECTED" ] && ! diff <(awk '{ print $1, $3 }' "$RUNNER_TEMP/images.txt" | sort) \
            <(printf '%s\n' "$EXPECTED" | sort); then
            echo "::error::The images built from ${CANDIDATE} are not the ones expected."
            exit 1
          fi
          delimiter="IMAGES_$(openssl rand -hex 16)"
          {
            echo "images<<${delimiter}"
            awk '{ print $1, $3 }' "$RUNNER_TEMP/images.txt"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        if: steps.current.outputs.superseded != 'true'
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Copy the images into the environment's registry
        if: steps.current.outputs.superseded != 'true'
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          registry="${AZURE_CONTAINER_REGISTRY%%.*}"
          while read -r name reference digest; do
            az acr import --name "$registry" --source "${reference}@${digest}" \
              --image "${name}:${CANDIDATE}" --username "$GITHUB_ACTOR" --password "$GHCR_TOKEN" \
              --force --only-show-errors
          done < "$RUNNER_TEMP/images.txt"
      - name: Run the database migrations with the new API image
        if: steps.current.outputs.superseded != 'true'
        run: |
          digest=$(awk '$1 == "api" { print $3 }' "$RUNNER_TEMP/images.txt")
          job=(--name "$AZURE_MIGRATE_JOB" --resource-group "$AZURE_RESOURCE_GROUP")
          # Waits for an execution to end: 0 if it succeeded, 1 if it ended
          # otherwise, 2 if it may still be running. A status that cannot be
          # read is tried again before giving up.
          wait_for() {
            local failures=0 status
            for _ in $(seq 60); do
              if status=$(az containerapp job execution show "${job[@]}" \
                --job-execution-name "$1" --query properties.status --output tsv); then
                failures=0
                case "$status" in
                  Succeeded) return 0 ;;
                  Failed | Stopped | Degraded)
                    echo "::error::Migration ${1} ended ${status}."
                    return 1
                    ;;
                esac
              elif [ $((++failures)) -ge 3 ]; then
                echo "::error::Could not read the status of migration ${1}."
                return 2
              fi
              sleep 10
            done
            echo "::error::Migration ${1} did not finish in 10 minutes."
            return 2
          }
          # One still running from an earlier deployment is waited for, so
          # two never run at once.
          running=$(az containerapp job execution list "${job[@]}" \
            --query "[?properties.status=='Running'].name" --output tsv)
          for earlier in $running; do
            ended=0
            wait_for "$earlier" || ended=$?
            if [ "$ended" -eq 2 ]; then
              echo "::error::An earlier migration, ${earlier}, may still be running; deploy again once it has ended."
              exit 1
            fi
          done
          az containerapp job update "${job[@]}" \
            --image "${AZURE_CONTAINER_REGISTRY}/api@${digest}" --output none
          execution=$(az containerapp job start "${job[@]}" --query name --output tsv)
          # Stopped if this deployment gives up on it, or is cancelled, so a
          # retry never starts a second one beside it.
          stop() {
            if ! az containerapp job stop "${job[@]}" --job-execution-name "$execution" --output none; then
              echo "::warning::Could not stop migration ${execution}; it may still be running."
            fi
          }
          trap 'stop; exit 1' INT TERM
          ended=0
          wait_for "$execution" || ended=$?
          if [ "$ended" -eq 2 ]; then stop; fi
          exit "$ended"
      - name: Deploy the new images, and wait for their revisions
        if: steps.current.outputs.superseded != 'true'
        run: |
          while read -r name _ digest; do
            case "$name" in
              api) app="$AZURE_API_APP" ;;
              web) app="$AZURE_WEB_APP" ;;
              *) continue ;;
            esac
            image="${AZURE_CONTAINER_REGISTRY}/${name}@${digest}"
            revision=$(az containerapp update --name "$app" --resource-group "$AZURE_RESOURCE_GROUP" \
              --image "$image" --query properties.latestRevisionName --output tsv)
            # The previous revision keeps answering until the new one is
            # ready, so the new one itself must be healthy, with all traffic.
            ready=false
            for _ in $(seq 60); do
              read -r provisioning health traffic serving <<< "$(az containerapp revision show \
                --name "$app" --resource-group "$AZURE_RESOURCE_GROUP" --revision "$revision" \
                --query "join(' ', [to_string(properties.provisioningState), to_string(properties.healthState), to_string(properties.trafficWeight), to_string(properties.template.containers[0].image)])" \
                --output tsv)"
              if [ "$provisioning" = Failed ]; then
                echo "::error::Revision ${revision} of ${app} failed to provision."
                exit 1
              fi
              if [ "$provisioning" = Provisioned ] && [ "$health" = Healthy ] && [ "$traffic" = 100 ] \
                && [ "$serving" = "$image" ]; then
                ready=true
                break
              fi
              sleep 10
            done
            if [ "$ready" != true ]; then
              echo "::error::Revision ${revision} of ${app} did not become healthy with all traffic in 10 minutes."
              exit 1
            fi
          done < "$RUNNER_TEMP/images.txt"
      - name: Wait until the application is ready
        if: steps.current.outputs.superseded != 'true'
        run: >-
          curl --fail --silent --show-error --retry 30 --retry-delay 10 --retry-all-errors
          --max-time 10 --output /dev/null "${APP_URL}{{liftoff.readyPath}}"
