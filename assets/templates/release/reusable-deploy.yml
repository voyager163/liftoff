# Managed by Liftoff. Change it through Liftoff rather than by hand.
#
# Deploys the images built from one commit to one environment, by digest. It
# checks the environment is set up, verifies each image's build provenance,
# copies the images into the environment's registry, runs the database
# migrations with the new API image, then updates the container apps and
# waits until the application is ready. Until Azure is set up for the
# environment it fails, saying what is missing: it never reports a deployment
# that did not happen.
name: Deploy

on:
  workflow_call:
    inputs:
      environment:
        description: The environment to deploy to
        required: true
        type: string
      candidate:
        description: The commit the images were built from
        required: true
        type: string
      expected:
        description: '"name digest" lines the images must match, such as a release manifest''s'
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: ${{ inputs.environment }}
      url: ${{ vars.APP_URL }}
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
      id-token: write
      attestations: read
    env:
      ENVIRONMENT: ${{ inputs.environment }}
      CANDIDATE: ${{ inputs.candidate }}
      EXPECTED: ${{ inputs.expected }}
      IMAGES: {{liftoff.imageNames}}
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_CONTAINER_REGISTRY: ${{ vars.AZURE_CONTAINER_REGISTRY }}
      AZURE_API_APP: ${{ vars.AZURE_API_APP }}
      AZURE_WEB_APP: ${{ vars.AZURE_WEB_APP }}
      AZURE_MIGRATE_JOB: ${{ vars.AZURE_MIGRATE_JOB }}
      APP_URL: ${{ vars.APP_URL }}
    steps:
      - name: Check the environment is set up for deployments
        run: |
          missing=()
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AZURE_RESOURCE_GROUP \
            AZURE_CONTAINER_REGISTRY AZURE_API_APP AZURE_MIGRATE_JOB APP_URL{{liftoff.webVariable}}; do
            if [ -z "${!name:-}" ]; then missing+=("$name"); fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Deploy target not configured for ${ENVIRONMENT}: set ${missing[*]} as variables of the ${ENVIRONMENT} environment. See the infrastructure section of README.md."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/liftoff
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Find each image by digest and check how it was built
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          read -ra images <<< "$IMAGES"
          bash .github/liftoff/resolve-images.sh "$CANDIDATE" "${images[@]}" > "$RUNNER_TEMP/images.txt"
          if [ -n "$EXPECTED" ] && ! diff <(awk '{ print $1, $3 }' "$RUNNER_TEMP/images.txt" | sort) \
            <(printf '%s\n' "$EXPECTED" | sort); then
            echo "::error::The images built from ${CANDIDATE} are not the ones expected."
            exit 1
          fi
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Copy the images into the environment's registry
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          registry="${AZURE_CONTAINER_REGISTRY%%.*}"
          while read -r name reference digest; do
            az acr import --name "$registry" --source "${reference}@${digest}" \
              --image "${name}:${CANDIDATE}" --username "$GITHUB_ACTOR" --password "$GHCR_TOKEN" \
              --force --only-show-errors
          done < "$RUNNER_TEMP/images.txt"
      - name: Run the database migrations with the new API image
        run: |
          digest=$(awk '$1 == "api" { print $3 }' "$RUNNER_TEMP/images.txt")
          az containerapp job update --name "$AZURE_MIGRATE_JOB" --resource-group "$AZURE_RESOURCE_GROUP" \
            --image "${AZURE_CONTAINER_REGISTRY}/api@${digest}" --output none
          execution=$(az containerapp job start --name "$AZURE_MIGRATE_JOB" \
            --resource-group "$AZURE_RESOURCE_GROUP" --query name --output tsv)
          for _ in $(seq 60); do
            status=$(az containerapp job execution show --name "$AZURE_MIGRATE_JOB" \
              --resource-group "$AZURE_RESOURCE_GROUP" --job-execution-name "$execution" \
              --query properties.status --output tsv)
            case "$status" in
              Succeeded) exit 0 ;;
              Failed | Stopped | Degraded) echo "::error::The migrations ended ${status}."; exit 1 ;;
            esac
            sleep 10
          done
          echo "::error::The migrations did not finish in 10 minutes."
          exit 1
      - name: Deploy the new images
        run: |
          while read -r name _ digest; do
            case "$name" in
              api) app="$AZURE_API_APP" ;;
              web) app="$AZURE_WEB_APP" ;;
              *) continue ;;
            esac
            az containerapp update --name "$app" --resource-group "$AZURE_RESOURCE_GROUP" \
              --image "${AZURE_CONTAINER_REGISTRY}/${name}@${digest}" --output none
          done < "$RUNNER_TEMP/images.txt"
      - name: Wait until the application is ready
        run: >-
          curl --fail --silent --show-error --retry 30 --retry-delay 10 --retry-all-errors
          --max-time 10 --output /dev/null "${APP_URL}{{liftoff.readyPath}}"
