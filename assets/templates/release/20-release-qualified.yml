# Managed by Liftoff. Change it through Liftoff rather than by hand.
#
# Cuts a release from develop, once staging has qualified it. It checks the
# develop commit passed CI and the build, deploys its images to staging,
# qualifies them there with {{liftoff.qualification}}, then creates
# release/X.Y.Z at that commit and opens its pull request into main. Run it
# from develop.
#
# Until Azure is set up and the AZURE_DEPLOYMENTS variable is "on", staging is
# skipped and the release's pull request says it was not qualified there. Once
# it is on, a staging deployment or qualification that fails stops the release.
#
# With a release app (the RELEASE_APP_CLIENT_ID variable and
# RELEASE_APP_PRIVATE_KEY secret), the pull request starts its checks like
# any other. Without one it is opened with the workflow token, which starts
# no workflows, so this starts CI, CodeQL and the review policy for it at its
# exact head commit.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: The version to release, such as 1.2.0
        required: true
        type: string
      commit:
        description: The develop commit to release; the latest when empty
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  candidate:
    name: Check the candidate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      commit: ${{ steps.candidate.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/liftoff
      - name: Check CI and the build passed for it
        id: candidate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ inputs.commit }}
        run: node .github/liftoff/release.mjs candidate

  staging:
    name: Deploy to staging
    needs: candidate
    if: vars.AZURE_DEPLOYMENTS == 'on'
    uses: ./.github/workflows/reusable-deploy.yml
    permissions:
      contents: read
      packages: read
      id-token: write
      attestations: read
    with:
      environment: staging
      candidate: ${{ needs.candidate.outputs.commit }}

  qualify:
    name: Qualify on staging
    needs: [candidate, staging]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: staging
      url: ${{ vars.APP_URL }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.candidate.outputs.commit }}
{{liftoff.browserTests}}
      - name: Scan staging with the ZAP baseline
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: ${{ vars.APP_URL }}
          # Fail on failures only, not warnings; open no issues.
          cmd_options: -I
          allow_issue_writing: false

  release:
    name: Cut the release
    needs: [candidate, qualify]
    # Qualified on staging, or deployments are off, so there is no staging yet.
    if: >-
      ${{ !cancelled() && needs.candidate.result == 'success' &&
      (needs.qualify.result == 'success' ||
      (needs.qualify.result == 'skipped' && vars.AZURE_DEPLOYMENTS != 'on')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/liftoff
      - name: Use the release app, if there is one
        id: app
        if: vars.RELEASE_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          # To check that CI and the build passed.
          permission-actions: read
      - name: Cut the release and open its pull request
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token || github.token }}
          DISPATCH: ${{ steps.app.outputs.token == '' }}
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ needs.candidate.outputs.commit }}
          QUALIFIED: ${{ needs.qualify.result == 'success' }}
        run: node .github/liftoff/release.mjs open-release
