# Managed by Liftoff. Change it through Liftoff rather than by hand.
#
# After a release or hotfix merges into main: checks main has exactly the
# tree CI qualified, finds each image built from it by digest and checks how
# it was built, then attests the release manifest for those images, tags
# vX.Y.Z, publishes the GitHub release and opens the pull request that brings
# main back into develop. Other pushes to main have nothing to do.
name: After release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: after-release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  identify:
    name: Find the release this push merged
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # It reads which pull request the push merged.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      release: ${{ steps.release.outputs.release }}
      kind: ${{ steps.release.outputs.kind }}
      version: ${{ steps.release.outputs.version }}
      candidate: ${{ steps.release.outputs.candidate }}
      pull-request: ${{ steps.release.outputs.pull-request }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/liftoff
      - name: Find the release and check main has exactly its tree
        id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/liftoff/release.mjs identify

  publish:
    name: Publish the release
    needs: identify
    if: needs.identify.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      actions: write
      packages: read
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.identify.outputs.version }}
      CANDIDATE: ${{ needs.identify.outputs.candidate }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/liftoff
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Find each image by digest and check how it was built
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGES: {{liftoff.imageNames}}
        run: |
          read -ra images <<< "$IMAGES"
          bash .github/liftoff/resolve-images.sh "$CANDIDATE" "${images[@]}" > "$RUNNER_TEMP/images.txt"
      - name: Write the release manifest
        id: manifest
        env:
          GITHUB_TOKEN: ${{ github.token }}
          KIND: ${{ needs.identify.outputs.kind }}
          PULL_REQUEST: ${{ needs.identify.outputs.pull-request }}
          IMAGES_FILE: ${{ runner.temp }}/images.txt
          MANIFEST_FILE: ${{ runner.temp }}/release-manifest.json
          SUBJECTS_FILE: ${{ runner.temp }}/release-subjects.txt
        run: node .github/liftoff/release.mjs manifest
      - name: Attest the release manifest for each image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ${{ steps.manifest.outputs.subjects }}
          predicate-type: ${{ steps.manifest.outputs.predicate-type }}
          predicate-path: ${{ steps.manifest.outputs.manifest }}
      - name: Tag and publish the release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MANIFEST_FILE: ${{ steps.manifest.outputs.manifest }}
        run: node .github/liftoff/release.mjs publish
      - name: Use the release app, if there is one
        id: app
        if: vars.RELEASE_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Open the pull request that brings main back into develop
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token || github.token }}
          DISPATCH: ${{ steps.app.outputs.token == '' }}
        run: node .github/liftoff/release.mjs sync
