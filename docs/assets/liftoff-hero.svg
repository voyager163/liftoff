      <path d="M0-65C-5-57-8-48-10-38H10C8-48 5-57 0-65Z" fill="#eff4f7"/>
      <path d="M-12-9H12L11-3H-11Z" fill="#173049"/>
      <ellipse cy="-27" rx="4.5" ry="7" fill="#102739" stroke="#93b5cb" stroke-width="1.5"/>
      <path d="M-7 19H7L6 24H-6Z" fill="#8c9ca5"/>
    </g>
    <g fill="#ffd198">
      <circle cx="1162" cy="435" r="1.8" opacity=".6"/>
      <circle cx="1140" cy="492" r="1" opacity=".45"/>
      <circle cx="1098" cy="537" r="1.4" opacity=".55"/>
      <circle cx="1027" cy="604" r="1.2" opacity=".4"/>
      <circle cx="1177" cy="406" r="1" opacity=".65"/>
