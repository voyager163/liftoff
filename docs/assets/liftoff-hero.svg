    <text x="103" y="420" fill="#f5f8fc" font-family="Arial, Helvetica, sans-serif" font-size="164" font-weight="700" letter-spacing="-7">Liftoff</text>
    <path d="M112 467H172" stroke="#eda868" stroke-width="3"/>
    <text x="193" y="476" fill="#b9cbdc" font-family="Arial, Helvetica, sans-serif" font-size="25" letter-spacing="1">A considered start. A clear path forward.</text>
