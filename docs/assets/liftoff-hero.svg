<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640" role="img" aria-labelledby="title description">
  <title id="title">Liftoff</title>
  <desc id="description">An original illustration of a silver rocket rising above a blue planetary horizon, leaving an illuminated amber trail across deep space.</desc>
  <defs>
    <linearGradient id="space" x2="1" y2="1">
      <stop stop-color="#060b15"/>
      <stop offset=".6" stop-color="#0c182b"/>
      <stop offset="1" stop-color="#142942"/>
    </linearGradient>
    <radialGradient id="horizon">
      <stop stop-color="#589bc4" stop-opacity=".32"/>
      <stop offset=".55" stop-color="#254b75" stop-opacity=".12"/>
      <stop offset="1" stop-color="#10243b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="earth" x1="0" y1="0" x2=".2" y2="1">
      <stop stop-color="#1d4261"/>
      <stop offset=".22" stop-color="#10263a"/>
      <stop offset="1" stop-color="#080e19"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="1" x2=".75" y2="0">
      <stop stop-color="#df6233" stop-opacity="0"/>
      <stop offset=".45" stop-color="#f19a48" stop-opacity=".5"/>
      <stop offset=".82" stop-color="#ffcb82"/>
      <stop offset="1" stop-color="#fff2cd"/>
    </linearGradient>
    <linearGradient id="metal">
      <stop stop-color="#446077"/>
      <stop offset=".36" stop-color="#d8e6ed"/>
      <stop offset=".57" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#7994a5"/>
    </linearGradient>
    <linearGradient id="exhaust" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#ffffff"/>
      <stop offset=".2" stop-color="#ffebb6"/>
      <stop offset=".65" stop-color="#f49a49" stop-opacity=".75"/>
      <stop offset="1" stop-color="#dc672e" stop-opacity="0"/>
    </linearGradient>
    <filter id="atmosphere" x="-30%" y="-100%" width="160%" height="300%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="plume" x="-100%" y="-30%" width="300%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <clipPath id="frame"><rect width="1600" height="640" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1600" height="640" fill="url(#space)"/>
    <ellipse cx="1190" cy="510" rx="760" ry="430" fill="url(#horizon)"/>
    <g fill="#b9d4e9">
      <circle cx="102" cy="93" r="1.4" opacity=".7"/>
      <circle cx="182" cy="190" r="1" opacity=".4"/>
      <circle cx="300" cy="63" r="1.7" opacity=".6"/>
      <circle cx="373" cy="148" r="1" opacity=".6"/>
      <circle cx="511" cy="93" r=".8" opacity=".8"/>
      <circle cx="586" cy="182" r="1.3" opacity=".5"/>
      <circle cx="680" cy="46" r="1" opacity=".6"/>
      <circle cx="754" cy="132" r="1.8" opacity=".85"/>
      <circle cx="867" cy="76" r="1" opacity=".5"/>
      <circle cx="944" cy="212" r="1.1" opacity=".6"/>
      <circle cx="1070" cy="59" r="1.6" opacity=".7"/>
      <circle cx="1157" cy="137" r=".9" opacity=".7"/>
      <circle cx="1308" cy="56" r="1" opacity=".8"/>
      <circle cx="1435" cy="181" r="1.4" opacity=".7"/>
      <circle cx="1525" cy="87" r=".9" opacity=".6"/>
      <circle cx="1318" cy="337" r="1.2" opacity=".5"/>
      <circle cx="806" cy="294" r=".9" opacity=".4"/>
      <circle cx="65" cy="353" r="1" opacity=".3"/>
      <circle cx="471" cy="241" r=".8" opacity=".3"/>
      <circle cx="1480" cy="292" r="1" opacity=".6"/>
    </g>
    <path d="M711 752C1022 456 1347 387 1705 475" fill="none" stroke="#7bbfe2" stroke-width="27" opacity=".22" filter="url(#atmosphere)"/>
    <path d="M711 752C1022 456 1347 387 1705 475L1705 760Z" fill="url(#earth)"/>
    <path d="M711 752C1022 456 1347 387 1705 475" fill="none" stroke="#98d4ee" stroke-width="2" opacity=".68"/>
    <path d="M810 749C1097 477 1397 441 1705 510" fill="none" stroke="#406382" stroke-width="1" opacity=".4"/>
    <path d="M842 774C1050 620 1152 449 1229 259" fill="none" stroke="url(#trail)" stroke-width="65" opacity=".46" filter="url(#plume)"/>
    <path d="M851 755C1052 602 1157 427 1232 251" fill="none" stroke="url(#trail)" stroke-width="17" opacity=".74"/>
    <path d="M862 756C1057 593 1164 421 1235 248" fill="none" stroke="url(#trail)" stroke-width="4" opacity=".9"/>
    <path d="M828 756C1040 595 1145 427 1219 269" fill="none" stroke="url(#trail)" stroke-width="1.5" opacity=".42"/>
    <g transform="translate(1243 222) rotate(24)">
