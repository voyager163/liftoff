# https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference
# Add an entry for each package ecosystem (for example npm) as it is introduced.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Wait a week before proposing a new release, so a compromised or broken
    # release has time to be caught upstream.
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
