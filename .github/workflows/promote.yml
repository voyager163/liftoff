# Publishes a release the Release workflow built and verified, without
# rebuilding anything (DIST-004): the draft's own assets are checked again,
# then the GitHub release is published, which creates its tag. A stable
# release also goes to npm as the very tarball in the release, under
# "latest"; prereleases stay on GitHub.
#
# Only a draft the Release workflow built on main and then verified in the
# same run is published, and a stable release needs every bundle signed. Running it again finishes a
# promotion that stopped part way, or makes a published prerelease stable.
name: Promote

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version of the release to publish (for example 0.1.0)"
        required: true
        type: string
      stable:
        description: "Publish as the latest stable release, and to npm"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

# One Promote at a time; a Promote never waits behind a Release.
concurrency:
  group: release-promote
  cancel-in-progress: false

env:
  VERSION: ${{ inputs.version }}
  STABLE: ${{ inputs.stable }}

jobs:
  # Before the environment is used: a missing one would be created without
  # its reviewer, and a draft could then be published unreviewed.
  environment:
    name: Check the release environment
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Check it has a required reviewer and allows only main
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/check-environment.ts

  publish:
    name: Publish the release
    needs: environment
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    outputs:
      cask-sha256: ${{ steps.cask.outputs.sha256 }}
    permissions:
      contents: write
      attestations: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
      - name: Download the release's assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/assets"
          gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/assets"
      - name: Read the commit the release was made at
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          target="$(gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq .targetCommitish)"
          [[ "$target" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::v$VERSION was not made at a commit: $target"; exit 1; }
          echo "TARGET=$target" >> "$GITHUB_ENV"
      - name: Check the checksums and attestations again
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: ${{ runner.temp }}/assets
        run: |
          sha256sum -c SHA256SUMS
          # Made by the Release workflow, on main, at the release's commit.
          signer=(--repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
            --source-ref refs/heads/main --source-digest "$TARGET")
          for file in voyager163-liftoff-*.tgz liftoff-package-* liftoff-*.msi liftoff-*.cdx.json SHA256SUMS; do
            gh attestation verify "$file" "${signer[@]}"
          done
          for file in liftoff-package-* liftoff-*.msi; do
            gh attestation verify "$file" "${signer[@]}" --predicate-type https://cyclonedx.org/bom
          done
          # The run that built them, from their signed provenance rather than
          # the release notes, which anyone who can write releases may edit.
          runs="$(for file in voyager163-liftoff-*.tgz liftoff-package-* liftoff-*.msi; do
            gh attestation verify "$file" "${signer[@]}" --format json \
              --jq '.[].verificationResult.statement.predicate.runDetails.metadata.invocationId'
          done | sed -nE 's#^https://github\.com/[^/]+/[^/]+/actions/runs/([0-9]+)/.*#\1#p' | sort -u)"
          [[ "$runs" =~ ^[0-9]+$ ]] || { echo "::error::the assets do not name one Release run: $runs"; exit 1; }
          echo "RELEASE_RUN=$runs" >> "$GITHUB_ENV"
      # Checked against SHA256SUMS and its attestation just above.
      - name: Read the macOS bundle's checksum for the Homebrew cask
        id: cask
        working-directory: ${{ runner.temp }}/assets
        run: echo "sha256=$(sha256sum liftoff-package-aarch64-apple-darwin.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Check the release may be published as asked
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/check-promote.ts "$VERSION" "$STABLE" "$RUNNER_TEMP/assets"
      # Before anything becomes public: a published release is immutable, so
      # an npm version that cannot be the release's tarball stops it here.
      - name: Check npm can take this release
        if: inputs.stable
        working-directory: ${{ runner.temp }}/assets
        run: |
          tarball="voyager163-liftoff-$VERSION.tgz"
          # npm never takes a version number again once it was published,
          # even after it is unpublished, and then views it as missing.
          if times="$(npm view @voyager163/liftoff time --json 2>"$RUNNER_TEMP/npm-time.log")"; then
            if node -e 'process.exit(Object.hasOwn(JSON.parse(process.argv[1]), process.argv[2]) ? 0 : 1)' "$times" "$VERSION" \
              && ! npm view "@voyager163/liftoff@$VERSION" version >/dev/null 2>&1; then
              echo "::error::npm had $VERSION once and will never take it again; release a new version"
              exit 1
            fi
          elif ! grep -q E404 "$RUNNER_TEMP/npm-time.log"; then
            cat "$RUNNER_TEMP/npm-time.log"
            echo "::error::cannot read npm's history of @voyager163/liftoff"
            exit 1
          fi
          if published="$(npm view "@voyager163/liftoff@$VERSION" dist.shasum 2>"$RUNNER_TEMP/npm-view.log")" && [ -n "$published" ]; then
            ours="$(sha1sum "$tarball" | cut -d' ' -f1)"
            [ "$published" = "$ours" ] || { echo "::error::npm has $VERSION with a different tarball"; exit 1; }
            echo "npm already has this tarball as $VERSION (a promotion run again)"
            echo "NPM_PUBLISHED=true" >> "$GITHUB_ENV"
          elif [ -z "${published:-}" ] && grep -q E404 "$RUNNER_TEMP/npm-view.log"; then
            echo "NPM_PUBLISHED=false" >> "$GITHUB_ENV"
          else
            cat "$RUNNER_TEMP/npm-view.log"
            echo "::error::cannot tell whether npm already has $VERSION"
            exit 1
          fi
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$STABLE" = true ]; then
            gh release edit "v$VERSION" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false --latest
          else
            gh release edit "v$VERSION" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease
          fi
      - name: Publish the package to npm
        if: inputs.stable && env.NPM_PUBLISHED == 'false'
        working-directory: ${{ runner.temp }}/assets
        # Trusted publishing: npm takes the workflow's OIDC identity, no token.
        run: npm publish "./voyager163-liftoff-$VERSION.tgz" --access public --tag latest --provenance

  # The tap's cask follows each stable release (CHAN-003). A job of its own
  # in the release environment, so the pull request is approved apart from
  # the release, and only it has the tap's token. Run again, it finds the
  # tap already has the version, or updates the open pull request.
  tap:
    name: Open the Homebrew tap pull request
    needs: publish
    if: inputs.stable
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
    env:
      CASK_SHA256: ${{ needs.publish.outputs.cask-sha256 }}
      TAP_REPOSITORY: voyager163/homebrew-tap
    steps:
      - name: Require the tap's token
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          [ -n "$HOMEBREW_TAP_TOKEN" ] || { echo "::error::set HOMEBREW_TAP_TOKEN in the release environment, then run Promote again"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: voyager163/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          persist-credentials: false
          path: tap
      - name: Update the cask's version and checksum
        run: node scripts/release/homebrew.ts update-tap "$VERSION" "$CASK_SHA256" tap
      - name: Push the change and open the pull request
        working-directory: tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          # update-tap stages the cask, a new one included.
          if git diff --cached --quiet; then
            echo "the tap already has liftoff $VERSION"
            exit 0
          fi
          branch="liftoff-$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -m "liftoff $VERSION"
          # git asks gh for the token, which only this step has.
          gh auth setup-git
          git push --force origin "$branch"
          if [ -z "$(gh pr list --repo "$TAP_REPOSITORY" --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create --repo "$TAP_REPOSITORY" --head "$branch" --title "liftoff $VERSION" \
              --body "Liftoff $VERSION, released at https://github.com/$GITHUB_REPOSITORY/releases/tag/v$VERSION. The checksum is the release's attested SHA256SUMS entry."
          fi
