name: Hosted native custody qualification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-custody-qualification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualify-native-custody:
    name: Full suite and source-complete coverage (macOS ARM64)
    runs-on: macos-15
    timeout-minutes: 240
    permissions:
      contents: read
    env:
      CI: "true"
      DO_NOT_TRACK: "1"
      LIFTOFF_TELEMETRY: "0"
      LIFTOFF_HCL_TEST_LANE: native
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.21.0"
          architecture: arm64
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14.7"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27.0"
          cache-dependency-path: assets/supported-stack.json
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2
        with:
          tofu_version: 1.12.6
          tofu_wrapper: false
      - name: Install uv
        run: python -m pip install uv==0.12.7
      - name: Select supported npm
        run: npm install --global "npm@12.0.2"
      - name: Install pinned OpenSpec
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/liftoff-openspec" --no-package-lock --ignore-scripts --no-audit --no-fund @fission-ai/openspec@1.11.0
          echo "$RUNNER_TEMP/liftoff-openspec/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Install dependencies
        run: npm ci
      - name: Verify native toolchain
        id: toolchain
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          const run = (executable, args) => execFileSync(executable, args, { encoding: 'utf8', shell: false }).trim();
          assert.deepEqual(
            { platform: process.platform, architecture: process.arch, node: process.versions.node },
            { platform: 'darwin', architecture: 'arm64', node: '24.21.0' }
          );
          assert.equal(run('npm', ['--version']), '12.0.2');
          assert.match(run('tofu', ['version']), /^OpenTofu v1\.12\.6(?:\n|$)/);
          assert.equal(run('openspec', ['--version']), '1.11.0');
          assert.equal(run('go', ['version']), 'go version go1.27.0 darwin/arm64');
          assert.equal(run('python', ['--version']), 'Python 3.14.7');
          assert.match(run('uv', ['--version']), /^uv 0\.12\.7(?:\s|$)/);
          NODE
      - name: Verify exact clean candidate
        id: clean-start
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Check supported stack
        id: supported-stack
        if: ${{ !cancelled() }}
        run: npm run check:supported-stack
      - name: Build
        id: build
        if: ${{ !cancelled() }}
        run: npm run build -- --pretty false
      - name: Run unfiltered full suite
        id: full-suite
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          mkdir -p qualification
          set -o pipefail
          npm test -- --maxWorkers=1 --no-file-parallelism --reporter=dot 2>&1 | tee qualification/native-full-suite.log
      - name: Run source-complete CLI coverage
        id: coverage
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          mkdir -p qualification
          set -o pipefail
          npm run coverage:cli -- --max-workers 1 2>&1 | tee qualification/native-coverage.log
      - name: Verify source-complete coverage evidence
        id: coverage-verify
        if: ${{ !cancelled() }}
        run: node scripts/coverage-gate.mjs verify cli
      - name: Run focused custody and history checks
        id: focused
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -o pipefail
          npx vitest run \
            tests/governance-state-handover.test.ts \
            tests/governance-transitions.test.ts \
            tests/governance-activation-v2.test.ts \
            tests/modern-activation-contract-parity.test.ts \
            tests/update-compatibility.test.ts \
            tests/contract-baseline.test.ts \
            tests/governance-extraction.test.ts \
            tests/plugin-generation-parity.test.ts \
            tests/generator-parity.test.ts \
            tests/modern-managed-core.test.ts \
            tests/modern-source-registry.test.ts \
            tests/pre-assessment-source-contract.test.ts \
            tests/project-telemetry-source.test.ts \
            tests/documentation.test.ts \
            tests/developer-activation-documentation.test.ts \
            --maxWorkers=1 --no-file-parallelism --reporter=dot 2>&1 | tee qualification/native-focused.log
      - name: Run package smoke
        id: package
        if: ${{ !cancelled() }}
        run: npm run smoke:package
      - name: Run repository policy
        id: policy
        if: ${{ !cancelled() }}
        run: npm run check:repository
      - name: Run strict OpenSpec validation
        id: openspec
        if: ${{ !cancelled() }}
        run: openspec validate modernize-liftoff-platform --strict --no-interactive
      - name: Verify final clean bytes
        id: clean-finish
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          git diff --check
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Record hosted native qualification evidence
        if: ${{ !cancelled() }}
        env:
          NATIVE_TOOLCHAIN_OUTCOME: ${{ steps.toolchain.outcome }}
          NATIVE_CLEAN_START_OUTCOME: ${{ steps.clean-start.outcome }}
          NATIVE_SUPPORTED_STACK_OUTCOME: ${{ steps.supported-stack.outcome }}
          NATIVE_BUILD_OUTCOME: ${{ steps.build.outcome }}
          NATIVE_FULL_SUITE_OUTCOME: ${{ steps.full-suite.outcome }}
          NATIVE_COVERAGE_OUTCOME: ${{ steps.coverage.outcome }}
          NATIVE_COVERAGE_VERIFY_OUTCOME: ${{ steps.coverage-verify.outcome }}
          NATIVE_FOCUSED_OUTCOME: ${{ steps.focused.outcome }}
          NATIVE_PACKAGE_OUTCOME: ${{ steps.package.outcome }}
          NATIVE_POLICY_OUTCOME: ${{ steps.policy.outcome }}
          NATIVE_OPENSPEC_OUTCOME: ${{ steps.openspec.outcome }}
          NATIVE_CLEAN_FINISH_OUTCOME: ${{ steps.clean-finish.outcome }}
        run: node scripts/native-custody-qualification.mjs record qualification/native-custody.json
      - name: Store hosted native qualification evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: liftoff-native-custody-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            qualification/native-custody.json
            qualification/native-full-suite.log
            qualification/native-coverage.log
            qualification/native-focused.log
            coverage/cli/
          if-no-files-found: error
          retention-days: 14
