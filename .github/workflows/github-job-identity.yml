name: GitHub job identity qualification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare-job-identity:
    name: Prepare dependency-free job identity program
    if: ${{ github.repository == 'voyager163/liftoff' && github.event_name == 'workflow_dispatch' && github.run_attempt == 1 && github.ref_type == 'branch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.21.0"
      - name: Transform only the explicit identity program with Node built-ins
        run: node scripts/qualify-github-job-identity.mjs prepare
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: liftoff-job-identity-program-${{ github.run_id }}-${{ github.run_attempt }}
          path: qualification/job-identity-program
          if-no-files-found: error
          retention-days: 14
  observe-job-identity:
    name: Observe signed GitHub job identity
    needs: prepare-job-identity
    if: ${{ github.repository == 'voyager163/liftoff' && github.event_name == 'workflow_dispatch' && github.run_attempt == 1 && github.ref_type == 'branch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.21.0"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: liftoff-job-identity-program-${{ github.run_id }}-${{ github.run_attempt }}
          path: qualification/job-identity-program
      - name: Verify signed original job facts without publishing or cloud access
        env:
          GH_TOKEN: ${{ github.token }}
        run: node qualification/job-identity-program/qualify.mjs observe
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: liftoff-job-identity-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: qualification/job-identity-program/job-identity-report.json
          if-no-files-found: error
          retention-days: 14
