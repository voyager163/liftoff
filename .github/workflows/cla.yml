name: CLA Assistant

on:
  issue_comment:
    types: [created]
  # pull_request_target runs with this repository's token, so this workflow must
  # never check out or execute code from the pull request.
  pull_request_target:
    types: [opened, closed, synchronize]

permissions: {}

jobs:
  cla:
    name: CLA
    # Only run in the canonical repository so forks are not blocked.
    if: ${{ github.repository == 'voyager163/liftoff' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: write
      pull-requests: write
      statuses: write
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        # Run on close only if the PR was merged, so the signed PR is locked to
        # preserve the agreement. Comments only count on pull requests.
        if: |
          (
            github.event_name == 'pull_request_target' &&
            (
              github.event.action == 'opened' ||
              github.event.action == 'synchronize' ||
              (github.event.action == 'closed' && github.event.pull_request.merged == true)
            )
          ) ||
          (
            github.event_name == 'issue_comment' &&
            github.event.issue.pull_request &&
            (
              github.event.comment.body == 'recheck' ||
              github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
            )
          )
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/voyager163/liftoff/blob/develop/docs/CLA.md
          path-to-signatures: signatures/cla.json
          branch: cla-signatures
          allowlist: voyager163,dependabot[bot],github-actions[bot]
