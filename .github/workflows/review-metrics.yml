# Weekly review metrics: merged pull requests, time to merge, human approvals
# per pull request, verified AI review rounds and reverts as the guardrail.
# Read-only; results appear in the job summary.
name: Review metrics

on:
  schedule:
    - cron: "7 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metrics:
    name: Review metrics
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/liftoff
      - name: Summarise the last four weeks
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/liftoff/review-metrics.mjs
