name: Template dependency audit

on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Audit packaged npm templates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22.12"
          cache: npm

      - name: Install Liftoff dependencies
        run: npm ci

      - name: Audit packaged template lockfiles
        run: npm run audit:template-dependencies
