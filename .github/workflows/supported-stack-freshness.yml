name: Supported stack freshness

on:
  schedule:
    - cron: "43 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freshness:
    name: Check supported stack baseline
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.20.0"
          cache: npm

      - name: Select supported npm
        run: npm install --global "npm@12.0.2"

      - name: Install dependencies
        run: npm ci

      - name: Check committed baseline consistency
        run: npm run check:supported-stack

      - name: Check canonical source freshness
        run: npm run check:supported-stack-freshness
