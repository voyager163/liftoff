name: Native Windows Code-only and signing refusal qualification

on:
  push:
    branches: [ voyager163-native-windows-f6b-qualification ]

permissions:
  contents: read

jobs:
  qualify:
    name: Native Windows source, Code-only syntax and real signing refusal
    runs-on: windows-2025
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      QUALIFIER_WORKFLOW_SHA: ${{ github.workflow_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
          cache: npm
      - name: Verify exact checked-out source
        shell: pwsh
        run: >
          $ErrorActionPreference = 'Stop'

          $source = (git rev-parse HEAD).Trim()

          if ($source -ne $env:GITHUB_SHA) { throw 'Unexpected checked-out
          source.' }
      - name: Select supported npm
        run: npm install --global "npm@12.0.2"
      - name: Install dependencies
        run: npm ci
      - name: Compile the native Windows launcher
        shell: cmd
        run: >
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft
          Visual Studio\Installer\vswhere.exe" -latest -products * -requires
          Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property
          installationPath`) do call "%%i\Common7\Tools\VsDevCmd.bat" -arch=x64
          -host_arch=x64

          cl /nologo /W4 /WX /O2 /MT /Fo:"%RUNNER_TEMP%\liftoff-launcher.obj"
          /Fe:"%RUNNER_TEMP%\liftoff-launcher.exe"
          distribution\windows\launcher.c /link /SUBSYSTEM:CONSOLE
      - name: Retrieve the pinned native runtime
        shell: bash
        run: >
          url="$(node --input-type=module -e 'import inputs from
          "./distribution/native/inputs.json" with { type: "json" }; import {
          nativeRuntimeInput } from "./scripts/native-bundle-contract.mjs";
          console.log(nativeRuntimeInput(inputs,
          {platform:process.platform,architecture:process.arch}).url)')"

          curl --fail --location --proto '=https' --proto-redir '=https'
          --max-time 180 \
            "$url" --output "$RUNNER_TEMP/liftoff-platform-runtime"
      - name: Build and qualify the isolated native package
        shell: bash
        run: >
          npm run build:native -- build --runtime-archive
          "$RUNNER_TEMP/liftoff-platform-runtime" \
            --output "$RUNNER_TEMP/liftoff-native-bundle" --windows-launcher "$RUNNER_TEMP/liftoff-launcher.exe"
          node scripts/native-release.mjs archive
          "$RUNNER_TEMP/liftoff-native-bundle"
          "$RUNNER_TEMP/liftoff-native-archive"

          LIFTOFF_NATIVE_PACKAGE_ROOT="$RUNNER_TEMP/liftoff-native-bundle" \

          LIFTOFF_NATIVE_ARCHIVE_ROOT="$RUNNER_TEMP/liftoff-native-archive" \

          npx vitest run tests/native-bundle.test.ts
          tests/native-distribution.test.ts \
            tests/native-release-set.test.ts tests/native-package-installed.test.ts \
            --maxWorkers=1 --no-file-parallelism --coverage.enabled=false --allowOnly=false \
            --reporter=default --reporter=json --outputFile.json=qualification/native-platform-package.json
          node scripts/native-package-report.mjs
          qualification/native-platform-package.json
          "$RUNNER_TEMP/liftoff-native-bundle" \
            > qualification/native-platform-gate.json
      - name: Record existing compiler prerequisites
        shell: pwsh
        run: >
          $ErrorActionPreference = 'Stop'

          $inno = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup *\ISCC.exe"
          -File |
            Sort-Object FullName -Descending | Select-Object -First 1
          $sign = Get-ChildItem "${env:ProgramFiles(x86)}\Windows
          Kits\10\bin\*\x64\signtool.exe" -File |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $inno -or -not $sign) { throw 'Required existing Inno
          compiler or native SDK SignTool is unavailable; nothing will be
          installed.' }

          $record = @{
            source = (git rev-parse HEAD).Trim()
            workflowCommit = $env:QUALIFIER_WORKFLOW_SHA
            eventCommit = $env:GITHUB_SHA
            runId = $env:GITHUB_RUN_ID
            runAttempt = $env:GITHUB_RUN_ATTEMPT
            iscc = @{ path = $inno.FullName; version = $inno.VersionInfo.FileVersion; sha256 = (Get-FileHash $inno.FullName -Algorithm SHA256).Hash.ToLowerInvariant() }
            signtool = @{ path = $sign.FullName; version = $sign.VersionInfo.FileVersion; sha256 = (Get-FileHash $sign.FullName -Algorithm SHA256).Hash.ToLowerInvariant() }
            certificateSelector = ('0' * 40)
            certificateCreated = $false
            installed = $false
            published = $false
          }

          $record | ConvertTo-Json -Depth 5 | Set-Content
          qualification/windows-prerequisites.json -Encoding utf8
      - name: Observe real production-script missing-certificate refusal
        shell: bash
        run: >
          node --input-type=module <<'NODE'

          import assert from 'node:assert/strict';

          import { createHash } from 'node:crypto';

          import { readFile, writeFile } from 'node:fs/promises';

          import { spawnSync } from 'node:child_process';

          import path from 'node:path';

          import { prepareNativeWindowsInstaller } from
          './scripts/native-release.mjs';

          import policy from './distribution/native/release-policy.json' with {
          type: 'json' };

          assert.equal(process.platform, 'win32');

          assert.equal(process.arch, 'x64');

          const prereq = JSON.parse((await
          readFile('qualification/windows-prerequisites.json',
          'utf8')).replace(/^\uFEFF/, ''));

          const output = path.join(process.env.RUNNER_TEMP,
          'liftoff-compile-only-inputs');

          const prepared = await prepareNativeWindowsInstaller({
            bundle: path.join(process.env.RUNNER_TEMP, 'liftoff-native-bundle'), output,
            approvedPolicy: { ...policy, approvedSigningKeySha256: '5'.repeat(64),
              winget: { packageIdentifier: 'Synthetic.LiftoffQualification', publisher: 'Synthetic compile-only fixture',
                certificateSha256: '6'.repeat(64), installerAppId: 'liftoff-unpublished-compile-only-fixture' } }
          });

          assert.equal(prepared.signed, false);

          const command = `$q${prereq.signtool.path}$q sign /fd SHA256 /sha1
          ${'0'.repeat(40)} $f`;

          const args = [`/Sliftoff=${command}`, path.join(output,
          'installer.iss')];

          const result = spawnSync(prereq.iscc.path, args, {
            cwd: process.cwd(), shell: false, encoding: 'utf8', timeout: 120_000, maxBuffer: 8 * 1024 * 1024
          });

          await writeFile('qualification/inno-compile.stdout', result.stdout ??
          '');

          await writeFile('qualification/inno-compile.stderr', result.stderr ??
          '');

          await writeFile('qualification/inno-compile-command.json',
          JSON.stringify({
            executable: prereq.iscc.path, args, status: result.status, signal: result.signal,
            error: result.error?.message ?? null, syntheticPolicy: true, prepared
          }, null, 2) + '\n');

          assert.equal(result.error, undefined);

          assert.equal(result.signal, null);

          assert.notEqual(result.status, 0, 'Signing must refuse the explicitly
          absent certificate; no success is authorized.');

          const combined = result.stdout + result.stderr;

          assert.match(combined, /Preparing Setup program executable/i, 'No
          observable real Setup/signing boundary.');

          assert.match(combined, /SignTool Error: No certificates were found
          that met all the given criteria/i,
            'Expected the real SDK missing-certificate refusal, not a syntax/compiler error or fallback signer.');
          const inputs = [];

          for (const name of ['installer.iss', 'inventory.iss', 'hashes.iss',
          'native-install.json', 'current.txt']) {
            const bytes = await readFile(path.join(output, name));
            await writeFile('qualification/inno-input-' + name, bytes, { flag: 'wx' });
            inputs.push({ name, bytes: bytes.length, sha256: createHash('sha256').update(bytes).digest('hex') });
          }

          await writeFile('qualification/inno-signing-refusal.json',
          JSON.stringify({
            source: prereq.source, workflowCommit: prereq.workflowCommit, runId: prereq.runId,
            runAttempt: prereq.runAttempt, compiler: prereq.iscc, signtool: prereq.signtool, inputs,
            certificateSelector: '0'.repeat(40), syntheticPolicy: true, pascalCompilationObserved: /Compiling \[Code\] section/i.test(combined),
            realMissingCertificateRefusalObserved: true, signed: false, compiledInstallerQualified: false,
            installerLifecycleQualified: false, certificateCreated: false, installed: false,
            minimumHostQualified: false, packageNamespaceQualified: false, published: false, releaseReady: false
          }, null, 2) + '\n');

          console.log('Real production-script signing boundary observed; real
          SDK refused the absent certificate. No installer/signature/lifecycle
          qualification.');

          NODE
      - name: Compile the exact nonproduction Code-only fixture without output
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { lstat, mkdir, readFile, readdir, realpath, writeFile } from 'node:fs/promises';
          import { spawnSync } from 'node:child_process';
          import path from 'node:path';

          assert.equal(process.platform, 'win32');
          assert.equal(process.arch, 'x64');
          const sha256 = bytes => createHash('sha256').update(bytes).digest('hex');
          const prereq = JSON.parse((await readFile('qualification/windows-prerequisites.json', 'utf8')).replace(/^\uFEFF/, ''));
          const sourcePath = 'distribution/windows/liftoff.iss';
          const source = await readFile(sourcePath);
          const committed = spawnSync('git', ['show', `${prereq.source}:${sourcePath}`], {
            shell: false, timeout: 30_000, maxBuffer: 1024 * 1024
          });
          assert.equal(committed.error, undefined);
          assert.equal(committed.status, 0);
          assert.ok(source.equals(committed.stdout), 'Original production script must equal the exact Git blob.');
          assert.match(source.toString('utf8'), /^SignedUninstaller=yes$/m);
          assert.match(source.toString('utf8'), /^SignTool=liftoff$/m);
          const marker = Buffer.from('[Code]\n');
          const codeOffset = source.indexOf(marker);
          assert.ok(codeOffset > 0);
          assert.equal(source.indexOf(marker, codeOffset + marker.length), -1);
          const code = source.subarray(codeOffset);
          assert.deepEqual([...code.toString('utf8').matchAll(/^\[([A-Za-z]+)\]\r?$/gm)].map(x => x[1]), ['Code']);
          const output = path.join(process.env.RUNNER_TEMP, 'liftoff-compile-only-inputs');
          const generated = await readFile(path.join(output, 'installer.iss'));
          const includeOffset = generated.indexOf(Buffer.from('\r\n#include '));
          assert.ok(includeOffset > 0);
          const defines = generated.subarray(0, includeOffset + 2);
          const defineLines = defines.toString('utf8').split('\r\n').filter(Boolean);
          assert.ok(defineLines.length > 0);
          assert.ok(defineLines.every(line => /^#define [A-Za-z][A-Za-z0-9]* "[^\r\n]*"$/.test(line)));
          const syntaxDir = path.join(output, 'pascal-syntax-only');
          await mkdir(syntaxDir);
          assert.equal((await lstat(syntaxDir)).isSymbolicLink(), false);
          assert.equal(path.relative(await realpath(output), await realpath(syntaxDir)), 'pascal-syntax-only');
          const header = Buffer.from(
            '[Setup]\r\nAppName=Liftoff nonproduction syntax fixture\r\n' +
            'AppVersion={#PackageVersion}\r\nDefaultDirName={tmp}\\liftoff-nonproduction-syntax-only\r\n' +
            'CreateAppDir=no\r\nUninstallable=no\r\nCreateUninstallRegKey=no\r\nOutput=no\r\nOutputDir=.\r\n\r\n'
          );
          const wrapper = Buffer.concat([defines, header, code]);
          assert.deepEqual([...wrapper.toString('utf8').matchAll(/^\[([A-Za-z]+)\]\r?$/gm)].map(x => x[1]), ['Setup', 'Code']);
          assert.doesNotMatch(wrapper.toString('utf8'), /^#include\b|^SignTool=|^SignedUninstaller=/m);
          const filename = path.join(syntaxDir, 'syntax-only.iss');
          await writeFile(filename, wrapper, { flag: 'wx' });
          const readBack = await readFile(filename);
          assert.ok(readBack.subarray(0, defines.length).equals(defines));
          assert.ok(readBack.subarray(readBack.indexOf(marker)).equals(committed.stdout.subarray(codeOffset)));
          await writeFile('qualification/inno-original-code.iss', code, { flag: 'wx' });
          await writeFile('qualification/inno-code-only-wrapper.iss', readBack, { flag: 'wx' });
          const args = [filename];
          const result = spawnSync(prereq.iscc.path, args, {
            cwd: syntaxDir, shell: false, encoding: 'utf8', timeout: 120_000, maxBuffer: 8 * 1024 * 1024
          });
          await writeFile('qualification/inno-code-only.stdout', result.stdout ?? '');
          await writeFile('qualification/inno-code-only.stderr', result.stderr ?? '');
          const filesAfter = (await readdir(syntaxDir)).sort();
          const productionUnchanged = (await readFile(sourcePath)).equals(source);
          const wrapperUnchanged = (await readFile(filename)).equals(wrapper);
          const pascalCompilationObserved = /Compiling \[Code\] section/i.test(result.stdout ?? '');
          await writeFile('qualification/inno-code-only-result.json', JSON.stringify({
            source: prereq.source, workflowCommit: prereq.workflowCommit, runId: prereq.runId,
            runAttempt: prereq.runAttempt, compiler: prereq.iscc, executable: prereq.iscc.path, args,
            cwd: syntaxDir, status: result.status, signal: result.signal, error: result.error?.message ?? null,
            productionScript: { path: sourcePath, bytes: source.length, sha256: sha256(source), unchanged: productionUnchanged },
            extractedCode: { offset: codeOffset, bytes: code.length, sha256: sha256(code), byteExactGitBlobSlice: true },
            literalDefines: { bytes: defines.length, sha256: sha256(defines), lines: defineLines.length, unchanged: true },
            wrapper: { bytes: wrapper.length, sha256: sha256(wrapper), unchanged: wrapperUnchanged,
              sections: ['Setup', 'Code'], output: false, uninstallable: false, filesSection: false },
            filesAfter, pascalCompilationObserved,
            syntaxOnlyCompilerSucceeded: result.error === undefined && result.signal === null && result.status === 0,
            fullProductionScriptCompiled: false, compiledInstallerQualified: false,
            signed: false, installerLifecycleQualified: false, minimumHostQualified: false,
            packageNamespaceQualified: false, certificateCreated: false, installed: false, published: false, releaseReady: false
          }, null, 2) + '\n');
          assert.equal(result.error, undefined);
          assert.equal(result.signal, null);
          assert.equal(result.status, 0, 'Real ISCC must compile the exact Code-only nonproduction fixture.');
          assert.equal(pascalCompilationObserved, true);
          assert.equal(productionUnchanged, true);
          assert.equal(wrapperUnchanged, true);
          assert.deepEqual(filesAfter, ['syntax-only.iss'], 'Output=no must not emit an installer.');
          console.log('Exact Code-only syntax fixture compiled with no installer output; production signing and lifecycle remain blocked.');
          NODE
      - name: Retain source-only qualification and original failures
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: liftoff-native-code-only-windows-${{ github.run_id }}-${{
            github.run_attempt }}
          path: |
            qualification/
            ${{ runner.temp }}/liftoff-native-bundle/bundle.json
            ${{ runner.temp }}/liftoff-native-archive/
          if-no-files-found: error
          retention-days: 14
