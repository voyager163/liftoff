name: Exact f6b Windows source qualification

on:
  push:
    branches: [voyager163-native-windows-f6b-qualification]

permissions:
  contents: read

jobs:
  qualify:
    name: Exact f6b native Windows source and signing refusal
    runs-on: windows-2025
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      QUALIFIER_WORKFLOW_SHA: ${{ github.workflow_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: f6b340d61a079f0a88488dd2677fd440678306ee
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.21.0"
          cache: npm
      - name: Verify exact checked-out source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = (git rev-parse HEAD).Trim()
          if ($source -ne 'f6b340d61a079f0a88488dd2677fd440678306ee') { throw 'Unexpected checked-out source.' }
      - name: Select supported npm
        run: npm install --global "npm@12.0.2"
      - name: Install dependencies
        run: npm ci
      - name: Compile the native Windows launcher
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do call "%%i\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
          cl /nologo /W4 /WX /O2 /MT /Fo:"%RUNNER_TEMP%\liftoff-launcher.obj" /Fe:"%RUNNER_TEMP%\liftoff-launcher.exe" distribution\windows\launcher.c /link /SUBSYSTEM:CONSOLE
      - name: Retrieve the pinned native runtime
        shell: bash
        run: |
          url="$(node --input-type=module -e 'import inputs from "./distribution/native/inputs.json" with { type: "json" }; import { nativeRuntimeInput } from "./scripts/native-bundle-contract.mjs"; console.log(nativeRuntimeInput(inputs, {platform:process.platform,architecture:process.arch}).url)')"
          curl --fail --location --proto '=https' --proto-redir '=https' --max-time 180 \
            "$url" --output "$RUNNER_TEMP/liftoff-platform-runtime"
      - name: Build and qualify the isolated native package
        shell: bash
        run: |
          npm run build:native -- build --runtime-archive "$RUNNER_TEMP/liftoff-platform-runtime" \
            --output "$RUNNER_TEMP/liftoff-native-bundle" --windows-launcher "$RUNNER_TEMP/liftoff-launcher.exe"
          node scripts/native-release.mjs archive "$RUNNER_TEMP/liftoff-native-bundle" "$RUNNER_TEMP/liftoff-native-archive"
          LIFTOFF_NATIVE_PACKAGE_ROOT="$RUNNER_TEMP/liftoff-native-bundle" \
          LIFTOFF_NATIVE_ARCHIVE_ROOT="$RUNNER_TEMP/liftoff-native-archive" \
          npx vitest run tests/native-bundle.test.ts tests/native-distribution.test.ts \
            tests/native-release-set.test.ts tests/native-package-installed.test.ts \
            --maxWorkers=1 --no-file-parallelism --coverage.enabled=false --allowOnly=false \
            --reporter=default --reporter=json --outputFile.json=qualification/native-platform-package.json
          node scripts/native-package-report.mjs qualification/native-platform-package.json "$RUNNER_TEMP/liftoff-native-bundle" \
            > qualification/native-platform-gate.json
      - name: Record existing compiler prerequisites
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $inno = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup *\ISCC.exe" -File |
            Sort-Object FullName -Descending | Select-Object -First 1
          $sign = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" -File |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $inno -or -not $sign) { throw 'Required existing Inno compiler or native SDK SignTool is unavailable; nothing will be installed.' }
          $record = @{
            source = (git rev-parse HEAD).Trim()
            workflowCommit = $env:QUALIFIER_WORKFLOW_SHA
            eventCommit = $env:GITHUB_SHA
            runId = $env:GITHUB_RUN_ID
            runAttempt = $env:GITHUB_RUN_ATTEMPT
            iscc = @{ path = $inno.FullName; version = $inno.VersionInfo.FileVersion; sha256 = (Get-FileHash $inno.FullName -Algorithm SHA256).Hash.ToLowerInvariant() }
            signtool = @{ path = $sign.FullName; version = $sign.VersionInfo.FileVersion; sha256 = (Get-FileHash $sign.FullName -Algorithm SHA256).Hash.ToLowerInvariant() }
            certificateSelector = ('0' * 40)
            certificateCreated = $false
            installed = $false
            published = $false
          }
          $record | ConvertTo-Json -Depth 5 | Set-Content qualification/windows-prerequisites.json -Encoding utf8
      - name: Probe real Inno compilation and absent-certificate refusal
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { readFile, writeFile } from 'node:fs/promises';
          import { spawnSync } from 'node:child_process';
          import path from 'node:path';
          import { prepareNativeWindowsInstaller } from './scripts/native-release.mjs';
          import policy from './distribution/native/release-policy.json' with { type: 'json' };
          assert.equal(process.platform, 'win32');
          assert.equal(process.arch, 'x64');
          const prereq = JSON.parse((await readFile('qualification/windows-prerequisites.json', 'utf8')).replace(/^\uFEFF/, ''));
          const output = path.join(process.env.RUNNER_TEMP, 'liftoff-compile-only-inputs');
          const prepared = await prepareNativeWindowsInstaller({
            bundle: path.join(process.env.RUNNER_TEMP, 'liftoff-native-bundle'), output,
            approvedPolicy: { ...policy, approvedSigningKeySha256: '5'.repeat(64),
              winget: { packageIdentifier: 'Synthetic.LiftoffQualification', publisher: 'Synthetic compile-only fixture',
                certificateSha256: '6'.repeat(64), installerAppId: 'liftoff-unpublished-compile-only-fixture' } }
          });
          assert.equal(prepared.signed, false);
          const command = `$q${prereq.signtool.path}$q sign /fd SHA256 /sha1 ${'0'.repeat(40)} $f`;
          const args = [`/Sliftoff=${command}`, path.join(output, 'installer.iss')];
          const result = spawnSync(prereq.iscc.path, args, {
            cwd: process.cwd(), shell: false, encoding: 'utf8', timeout: 120_000, maxBuffer: 8 * 1024 * 1024
          });
          await writeFile('qualification/inno-compile.stdout', result.stdout ?? '');
          await writeFile('qualification/inno-compile.stderr', result.stderr ?? '');
          await writeFile('qualification/inno-compile-command.json', JSON.stringify({
            executable: prereq.iscc.path, args, status: result.status, signal: result.signal,
            error: result.error?.message ?? null, syntheticPolicy: true, prepared
          }, null, 2) + '\n');
          assert.equal(result.error, undefined);
          assert.equal(result.signal, null);
          assert.notEqual(result.status, 0, 'Signing must refuse the explicitly absent certificate; no success is authorized.');
          const combined = result.stdout + result.stderr;
          assert.match(combined, /Compiling \[Code\] section/i, 'No observable Pascal compilation boundary.');
          assert.match(combined, /SignTool Error: No certificates were found that met all the given criteria/i,
            'Expected the real SDK missing-certificate refusal, not a syntax/compiler error or fallback signer.');
          const inputs = [];
          for (const name of ['installer.iss', 'inventory.iss', 'hashes.iss', 'native-install.json', 'current.txt']) {
            const bytes = await readFile(path.join(output, name));
            inputs.push({ name, bytes: bytes.length, sha256: createHash('sha256').update(bytes).digest('hex') });
          }
          await writeFile('qualification/inno-signing-refusal.json', JSON.stringify({
            source: prereq.source, workflowCommit: prereq.workflowCommit, runId: prereq.runId,
            runAttempt: prereq.runAttempt, compiler: prereq.iscc, signtool: prereq.signtool, inputs,
            certificateSelector: '0'.repeat(40), syntheticPolicy: true, pascalCompilationObserved: true,
            realMissingCertificateRefusalObserved: true, signed: false, compiledInstallerQualified: false,
            installerLifecycleQualified: false, certificateCreated: false, installed: false,
            minimumHostQualified: false, packageNamespaceQualified: false, published: false, releaseReady: false
          }, null, 2) + '\n');
          console.log('Real Pascal compilation observed; real SDK signing refused the absent certificate. No installer/signature/lifecycle qualification.');
          NODE
      - name: Retain source-only qualification and original failures
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: liftoff-native-f6b-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            qualification/
            ${{ runner.temp }}/liftoff-native-bundle/bundle.json
            ${{ runner.temp }}/liftoff-native-archive/
          if-no-files-found: error
          retention-days: 14
