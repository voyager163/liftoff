# Build and test Liftoff on its supported developer platforms, then report one
# aggregate status (`ci-gate`) that branch rules require. The gate fails
# unless every job it depends on succeeded: skipped, cancelled or missing
# jobs are failures, never passes.
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # Cancel superseded pull request runs only; never a branch or queue run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run boundaries
      - run: npm run check:trace
      - run: npm run check:generated
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
      - name: Check the Python template lock matches its pyproject
        run: node scripts/templates/lock-python.ts --check

  test:
    name: Test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-15
          - name: Windows x64
            os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Show platform
        shell: bash
        run: |
          node -p "'node ' + process.version + ' on ' + process.platform + '-' + process.arch"
          git --version
      - run: npm ci
      - run: npm run coverage
      - name: Keep the coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.os }}
          path: coverage/
          retention-days: 14
          if-no-files-found: error

  generated:
    name: Generated ${{ matrix.stack }} project (${{ matrix.platform.name }})
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: macOS arm64
            os: macos-15
          - name: Windows x64
            os: windows-latest
        stack: [python-fastapi, node-fastify, go-huma]
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Also the Node.js the generated frontend and the node-fastify project ask
      # for in their .node-version files.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        if: matrix.stack == 'python-fastapi'
        with:
          version: "0.13.1"
      # The generated project's go.mod names the Go it needs.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: matrix.stack == 'go-huma'
        with:
          go-version-file: assets/plugins/stack-go-huma/files/backend/go.mod
          cache-dependency-path: assets/plugins/stack-go-huma/files/backend/go.sum
      - run: npm ci
      - name: Create a project with the frontend and every agent host
        env:
          STACK: ${{ matrix.stack }}
        run: >-
          node src/cli/main.ts init --name demo --stack "$STACK" --frontend vue
          --workflow manual --agents copilot,codex,claude --owners voyager163
          --dir "$RUNNER_TEMP/demo" --yes
      - name: Install, lint and test the generated Python project
        if: matrix.stack == 'python-fastapi'
        working-directory: ${{ runner.temp }}/demo/backend
        run: |
          uv sync --locked
          uv run ruff check .
          uv run ruff format --check .
          uv run pytest
      - name: Install, lint, type-check and test the generated Node.js project
        if: matrix.stack == 'node-fastify'
        working-directory: ${{ runner.temp }}/demo/backend
        run: |
          test "$(node --version)" = "v$(cat .node-version)"
          npm ci --no-audit --no-fund
          npm run lint
          npm run typecheck
          npm test
      - name: Format, vet, test and check coverage of the generated Go project
        if: matrix.stack == 'go-huma'
        working-directory: ${{ runner.temp }}/demo/backend
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "Not gofmt-formatted:"; echo "$unformatted"; exit 1; fi
          go vet ./...
          go vet -tags integration ./...
          go test -coverpkg=./cmd/...,./internal/... -coverprofile=cover.out ./...
          go run ./tools/coverage cover.out 80
      - name: Lint, type-check, test and build the generated frontend
        working-directory: ${{ runner.temp }}/demo/frontend
        run: |
          test "$(node --version)" = "v$(cat .node-version)"
          npm ci --no-audit --no-fund
          npm run lint
          npm run typecheck
          npm test
          npm run build
      - name: Validate the generated project
        run: node src/cli/main.ts validate --dir "$RUNNER_TEMP/demo"

  services:
    name: Generated ${{ matrix.stack }} project${{ matrix.ai && ' with an AI service' || '' }} with PostgreSQL and Docker
    # Generated projects' integration tests and containers qualify a
    # deployment target, not a CLI platform, so they run on Linux, where
    # service containers and Docker are available.
    strategy:
      fail-fast: false
      matrix:
        stack: [python-fastapi, node-fastify, go-huma]
        ai: [false]
        # The AI service beside the API (AISVC-002), with the frontend.
        include:
          - stack: go-huma
            ai: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-trixie@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
        env:
          POSTGRES_DB: app
          POSTGRES_USER: app
          # A throwaway database for this job only; not a secret.
          POSTGRES_PASSWORD: ci-only
        # Docker picks a free host port: the generated Compose file publishes
        # its own database on 5432, and a fixed port can be taken by another
        # connection on the runner.
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      STACK: ${{ matrix.stack }}
      AI_SERVICE: ${{ matrix.ai }}
      PGHOST: 127.0.0.1
      PGUSER: app
      PGPASSWORD: ci-only
      PGDATABASE: app
    steps:
      - name: Use the host port Docker gave the PostgreSQL service
        env:
          PORT: ${{ job.services.postgres.ports['5432'] }}
        run: echo "PGPORT=$PORT" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        if: matrix.stack == 'python-fastapi'
        with:
          version: "0.13.1"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: matrix.stack == 'go-huma'
        with:
          go-version-file: assets/plugins/stack-go-huma/files/backend/go.mod
          cache-dependency-path: assets/plugins/stack-go-huma/files/backend/go.sum
      - run: npm ci
      - name: Create the project with the frontend
        run: |
          ai=()
          if [ "$AI_SERVICE" = true ]; then ai=(--ai --ai-pattern generic); fi
          node src/cli/main.ts init --name demo --stack "$STACK" --frontend vue \
            --workflow manual --dir "$RUNNER_TEMP/demo" --yes "${ai[@]}"
      - name: Put data in public that the integration tests must leave alone
        run: >-
          psql -v ON_ERROR_STOP=1
          -c "CREATE TABLE items (id serial PRIMARY KEY, name text)"
          -c "INSERT INTO items (name) VALUES ('keep me')"
      - name: Run the integration tests against PostgreSQL
        working-directory: ${{ runner.temp }}/demo/backend
        run: |
          case "$STACK" in
            python-fastapi)
              uv sync --locked
              APP_DATABASE_URL="postgresql+psycopg://app:ci-only@127.0.0.1:$PGPORT/app" \
                uv run pytest -m integration --no-cov ;;
            node-fastify)
              npm ci --no-audit --no-fund
              APP_DATABASE_URL="postgresql://app:ci-only@127.0.0.1:$PGPORT/app" \
                npm run test:integration ;;
            go-huma)
              APP_DATABASE_URL="postgresql://app:ci-only@127.0.0.1:$PGPORT/app" \
                go test -count=1 -tags integration ./internal/integration ;;
            *)
              echo "No integration tests are known for $STACK"
              exit 1 ;;
          esac
      - name: Check the integration tests left public and the database clean
        run: |
          test "$(psql -tAc "SELECT string_agg(name, ',') FROM public.items")" = "keep me"
          test "$(psql -tAc "SELECT count(*) FROM information_schema.tables WHERE table_schema = 'public'")" = "1"
          test "$(psql -tAc "SELECT count(*) FROM information_schema.schemata WHERE schema_name LIKE 'test%' OR schema_name = 'drizzle'")" = "0"
      - name: Run the project with Docker Compose and check its health
        working-directory: ${{ runner.temp }}/demo
        run: |
          sed 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-only-compose/' .env.example > .env
          docker compose up --build --wait --wait-timeout 300
          user=$(docker inspect --format '{{.Config.User}}' "$(docker compose ps -q api)")
          case "$user" in 10001|10001:*) ;; *) echo "the API runs as '$user', not 10001"; exit 1 ;; esac
          api=http://127.0.0.1:8000
          # Prints the HTTP status, or 000 when nothing answered in time. It
          # never fails, so a probe that times out counts as one more attempt
          # instead of ending the step.
          status() { curl --silent --output /dev/null --write-out '%{http_code}' --max-time "$2" "$api$1" || return 0; }
          test "$(status /health/live 5)" = 200
          test "$(status /health/ready 5)" = 200
          created=$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 5 \
            -X POST -H 'content-type: application/json' -d '{"name":"from compose"}' "$api/items")
          test "$created" = 201
          curl --fail --silent --show-error --location --max-time 5 --output /dev/null "$api/docs"
          curl --fail --silent --show-error --max-time 5 "$api/openapi.json" | grep -q '"openapi"'

          docker compose pause database
          start=$(date +%s)
          ready=$(status /health/ready 20)
          elapsed=$(( $(date +%s) - start ))
          echo "readiness with the database paused: $ready after ${elapsed}s"
          test "$ready" = 503
          test "$elapsed" -le 10
          test "$(status /health/live 5)" = 200
          docker compose unpause database
          for _ in $(seq 1 30); do
            ready=$(status /health/ready 5)
            [ "$ready" = 200 ] && break
            sleep 1
          done
          echo "readiness after unpausing: $ready"
          test "$ready" = 200

          uid=$(docker compose exec -T web id -u)
          if [ "$uid" = 0 ]; then echo "the frontend runs as root"; exit 1; fi
          web=http://127.0.0.1:8080
          curl --fail --silent --show-error --max-time 5 "$web/" | grep -q '<div id="app">'
          curl --fail --silent --show-error --max-time 5 --head "$web/" | grep -qi '^content-security-policy:'
          curl --fail --silent --show-error --max-time 5 "$web/api/health/ready" | grep -q '"ready"'
      - name: Check the AI service runs unprivileged and is ready
        if: matrix.ai
        working-directory: ${{ runner.temp }}/demo
        run: |
          uid=$(docker compose exec -T ai-service id -u)
          test -n "$uid" && test "$uid" != 0
          # No port of it is published on the host; only the API reaches it.
          test "$(docker inspect --format '{{len .HostConfig.PortBindings}}' "$(docker compose ps -q ai-service)")" = 0
          docker compose exec -T ai-service python -c \
            "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5).status == 200 else 1)"
      - name: Run the frontend's browser test against the application
        working-directory: ${{ runner.temp }}/demo/frontend
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Check the frontend finds the API at a new address without a restart
        working-directory: ${{ runner.temp }}/demo
        run: |
          address() { docker inspect --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$(docker compose ps -q api)"; }
          web=$(docker compose ps -q web)
          network=$(docker inspect --format '{{range $name, $_ := .NetworkSettings.Networks}}{{$name}}{{end}}' "$web")
          before=$(address)
          docker compose rm --stop --force api
          # Docker would give the new container the freed address; hold it.
          holder=$(docker run --detach --rm --network "$network" --entrypoint sleep \
            postgres:18-trixie@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6 300)
          docker compose up --detach --no-deps --wait --wait-timeout 120 api
          after=$(address)
          docker stop "$holder"
          echo "API address: $before before, $after after"
          test "$before" != "$after"
          test "$(docker compose ps -q web)" = "$web"
          api=http://127.0.0.1:8080/api
          # Prints the HTTP status, or 000 when nothing answered in time; see
          # the Compose step.
          status() { curl --silent --output /dev/null --write-out '%{http_code}' --max-time "$2" "$api$1" || return 0; }
          ready=000
          for _ in $(seq 1 30); do
            ready=$(status /health/ready 5)
            [ "$ready" = 200 ] && break
            sleep 1
          done
          echo "readiness through the frontend: $ready"
          test "$ready" = 200
          # The browser test saved an item, which the moved API still lists.
          curl --fail --silent --show-error --max-time 5 "$api/items" | grep -q '"name"'
      # The images as a generated project's Build scans them, with the same
      # Trivy, so a fixable high or critical vulnerability fails here first.
      - name: Install Trivy, checked against its release checksum
        env:
          TRIVY_VERSION: "0.76.0"
          TRIVY_SHA256: e24b1c51293c1b15e4ba8d45bbc7891ba053f90278ec2698f3562c993e145fe7
        run: |
          archive="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/$archive" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${archive}"
          echo "${TRIVY_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" trivy
      - name: Scan the images as the project's build would
        working-directory: ${{ runner.temp }}/demo
        run: |
          # Example keys in installed packages' documentation, such as an
          # SDK's, are not the project's secrets; Trivy still looks for
          # secrets everywhere else in the image.
          cat > "$RUNNER_TEMP/trivy-secret.yaml" <<'RULES'
          allow-rules:
            - id: installed-packages
              description: Files of installed Python and npm packages
              path: '.*/(site-packages|node_modules)/.*'
          RULES
          # The images the project builds: api, ai-service with an AI service,
          # and web with a frontend.
          services=$(docker compose config --services)
          for service in api ai-service web; do
            if ! grep -qx "$service" <<< "$services"; then continue; fi
            image=$(docker inspect --format '{{.Config.Image}}' "$(docker compose ps -q "$service")")
            "$RUNNER_TEMP/trivy" image --exit-code 1 --severity HIGH,CRITICAL \
              --ignore-unfixed --no-progress --secret-config "$RUNNER_TEMP/trivy-secret.yaml" "$image"
          done
      - name: Show the Compose logs
        if: failure()
        working-directory: ${{ runner.temp }}/demo
        run: docker compose logs --no-color

  genai:
    name: Generated GenAI project (${{ matrix.pattern }}, ${{ matrix.platform.name }})
    # Every pattern on Linux, where the container also runs; the generic
    # pattern on the supported developer platforms too.
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Linux x64
            os: ubuntu-latest
        pattern: [generic, prompt, chatbot, rag, agent, multi-agent, fine-tuned, streaming, workflow]
        include:
          - pattern: generic
            platform:
              name: macOS arm64
              os: macos-15
          - pattern: generic
            platform:
              name: Windows x64
              os: windows-latest
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      PATTERN: ${{ matrix.pattern }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
      - run: npm ci
      - name: Create the project with every agent host
        run: >-
          node src/cli/main.ts init --name demo --workload genai --pattern "$PATTERN"
          --workflow manual --agents copilot,codex,claude --owners voyager163
          --dir "$RUNNER_TEMP/demo" --yes
      - name: Install, lint and test the project, offline
        working-directory: ${{ runner.temp }}/demo/backend
        run: |
          uv sync --locked
          uv run ruff check .
          uv run ruff format --check .
          uv run pytest
      - name: Run the project with Docker Compose and check its health
        if: runner.os == 'Linux'
        working-directory: ${{ runner.temp }}/demo
        run: |
          docker compose up --build --wait --wait-timeout 300
          user=$(docker inspect --format '{{.Config.User}}' "$(docker compose ps -q api)")
          case "$user" in 10001|10001:*) ;; *) echo "the API runs as '$user', not 10001"; exit 1 ;; esac
          api=http://127.0.0.1:8000
          curl --fail --silent --show-error --max-time 5 "$api/health/live" | grep -q '"ok"'
          curl --fail --silent --show-error --max-time 5 "$api/health/ready" | grep -q '"ready"'
          curl --fail --silent --show-error --location --max-time 5 --output /dev/null "$api/docs"
          curl --fail --silent --show-error --max-time 5 "$api/openapi.json" | grep -q '"/v1/'
      # The images as a generated project's Build scans them, with the same
      # Trivy, so a fixable high or critical vulnerability fails here first.
      - name: Install Trivy, checked against its release checksum
        if: runner.os == 'Linux'
        env:
          TRIVY_VERSION: "0.76.0"
          TRIVY_SHA256: e24b1c51293c1b15e4ba8d45bbc7891ba053f90278ec2698f3562c993e145fe7
        run: |
          archive="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/$archive" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${archive}"
          echo "${TRIVY_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" trivy
      - name: Scan the images as the project's build would
        if: runner.os == 'Linux'
        working-directory: ${{ runner.temp }}/demo
        run: |
          # Example keys in installed packages' documentation, such as an
          # SDK's, are not the project's secrets; Trivy still looks for
          # secrets everywhere else in the image.
          cat > "$RUNNER_TEMP/trivy-secret.yaml" <<'RULES'
          allow-rules:
            - id: installed-packages
              description: Files of installed Python and npm packages
              path: '.*/(site-packages|node_modules)/.*'
          RULES
          # The images the project builds, api and, with a frontend, web.
          services=$(docker compose config --services)
          for service in api web; do
            if ! grep -qx "$service" <<< "$services"; then continue; fi
            image=$(docker inspect --format '{{.Config.Image}}' "$(docker compose ps -q "$service")")
            "$RUNNER_TEMP/trivy" image --exit-code 1 --severity HIGH,CRITICAL \
              --ignore-unfixed --no-progress --secret-config "$RUNNER_TEMP/trivy-secret.yaml" "$image"
          done
      - name: Show the Compose logs
        if: failure() && runner.os == 'Linux'
        working-directory: ${{ runner.temp }}/demo
        run: docker compose logs --no-color
      - name: Validate the generated project
        run: node src/cli/main.ts validate --dir "$RUNNER_TEMP/demo"

  spec-workflows:
    name: Spec workflow (${{ matrix.workflow }}, ${{ matrix.platform.name }})
    # Runs each framework's real initializer at its pinned version, on the
    # platforms the CLI supports and on Linux.
    strategy:
      fail-fast: false
      matrix:
        workflow: [openspec, spec-kit]
        platform:
          - name: Linux x64
            os: ubuntu-latest
          - name: macOS arm64
            os: macos-15
          - name: Windows x64
            os: windows-latest
        include:
          - workflow: openspec
            files: >-
              openspec/config.yaml
              .claude/skills/openspec-propose/SKILL.md
              .agents/skills/openspec-propose/SKILL.md
              .github/skills/openspec-propose/SKILL.md
          - workflow: spec-kit
            files: >-
              .specify/memory/constitution.md
              .claude/skills/speckit-specify/SKILL.md
              .agents/skills/speckit-specify/SKILL.md
              .github/skills/speckit-specify/SKILL.md
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      WORKFLOW: ${{ matrix.workflow }}
      FILES: ${{ matrix.files }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
      - run: npm ci
      - name: Create the project with the framework's own initializer
        run: >-
          node src/cli/main.ts init --name demo --workflow "$WORKFLOW"
          --agents copilot,codex,claude --owners voyager163
          --dir "$RUNNER_TEMP/demo" --yes
      - name: Check the framework's files are there and recorded as its own
        working-directory: ${{ runner.temp }}/demo
        run: |
          node -e '
            const fs = require("node:fs");
            const manifest = JSON.parse(fs.readFileSync(".liftoff/manifest.json", "utf8"));
            const owned = new Set(
              manifest.files
                .filter((f) => f.ownership === "framework" && f.plugin === "workflow/" + process.env.WORKFLOW)
                .map((f) => f.path),
            );
            const missing = process.env.FILES.split(" ").filter((p) => !owned.has(p) || !fs.existsSync(p));
            console.log(owned.size + " files recorded as the framework\x27s own");
            if (missing.length > 0) { console.error("missing: " + missing.join(", ")); process.exit(1); }
          '
      - name: Validate the generated project
        run: node src/cli/main.ts validate --dir "$RUNNER_TEMP/demo"

  infrastructure:
    name: Generated infrastructure (${{ matrix.case.name }})
    # Generated OpenTofu code is formatted, validated against its committed
    # provider locks and scanned, as the project's own CI does. Nothing is
    # planned or applied.
    strategy:
      fail-fast: false
      matrix:
        case:
          - name: every environment, with the frontend
            options: --stack python-fastapi --frontend vue --infrastructure azure
          - name: production only, without a frontend
            options: --stack node-fastify --infrastructure azure --environments prod
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.13.2
          tofu_wrapper: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
      - run: npm ci
      - name: Check resource names against Azure's rules
        run: npm run check:azure-names
      - name: Create the project
        env:
          OPTIONS: ${{ matrix.case.options }}
        run: |
          read -ra options <<< "$OPTIONS"
          node src/cli/main.ts init --name demo "${options[@]}" --workflow manual \
            --dir "$RUNNER_TEMP/demo" --yes
      - name: Format, validate and scan the infrastructure
        working-directory: ${{ runner.temp }}/demo/infrastructure/opentofu/azure
        run: |
          tofu fmt -check -recursive
          for root in bootstrap environments/*; do
            echo "::group::$root"
            tofu -chdir="$root" init -backend=false -input=false -lockfile=readonly
            tofu -chdir="$root" validate
            echo "::endgroup::"
          done
          uvx --from checkov==3.3.29 checkov --directory . --framework terraform \
            --compact --quiet --skip-path .terraform
      - name: Validate the generated project
        run: node src/cli/main.ts validate --dir "$RUNNER_TEMP/demo"

  package:
    name: Native bundle (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-15
            bundle: liftoff-package-aarch64-apple-darwin
          - name: Windows x64
            os: windows-latest
            bundle: liftoff-package-x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    # Windows also builds three installers and installs each.
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Pack the npm package
        run: node scripts/package/pack.ts
      - name: Run Liftoff from the npm package outside the checkout
        run: |
          tarball="$(cd out && ls voyager163-liftoff-*.tgz)"
          # A POSIX path: Git Bash on Windows would read the backslashes in
          # RUNNER_TEMP (D:\a\_temp) inside npm's shell shims as escapes.
          prefix="$(cd "$RUNNER_TEMP" && pwd)/npm-prefix"
          # "./" keeps npm from reading out/... as a GitHub repository.
          (cd out && npm install -g --prefix "$prefix" --no-audit --no-fund "./$tarball")
          mkdir -p "$RUNNER_TEMP/npm-smoke"
          cd "$RUNNER_TEMP/npm-smoke"
          # npm links bin/ on macOS and the prefix itself on Windows.
          export PATH="$prefix/bin:$prefix:$PATH"
          liftoff --version
          liftoff init --name smoke --workflow manual --agents claude --yes
          liftoff validate --dir smoke
          test -f smoke/.gitignore
          test -f smoke/backend/.gitignore
      - name: Build the bundle from the same package
        run: node scripts/package/build-bundle.ts --package "out/$(cd out && ls voyager163-liftoff-*.tgz)"
      # Installed, upgraded and uninstalled as the runner's own user, which
      # is how a user installs it, with no elevation (DIST-006).
      - name: Check the Windows installer installs, upgrades and uninstalls
        if: runner.os == 'Windows'
        env:
          BUNDLE: ${{ matrix.bundle }}
        run: node scripts/package/check-msi.ts "out/$BUNDLE"
      # Signed ad hoc with the hardened runtime, as a release is signed, once
      # without each entitlement: Liftoff must need every one (DIST-005).
      # Where the runner has System Integrity Protection off, nothing is
      # enforced, and it checks only that Liftoff starts with them all.
      - name: Check the macOS executable needs each entitlement
        if: runner.os == 'macOS'
        env:
          BUNDLE: ${{ matrix.bundle }}
        run: node scripts/package/check-entitlements.ts "out/$BUNDLE"
      # A tar archive keeps the executable bit and dotfiles, such as
      # lib/app/.github/liftoff and the templates' .github directories, which
      # upload-artifact would drop.
      - name: Archive the bundle
        env:
          BUNDLE: ${{ matrix.bundle }}
        working-directory: out
        run: tar -czf "$BUNDLE.tar.gz" "$BUNDLE"
      - name: Run Liftoff from the extracted archive with no Node on PATH
        env:
          BUNDLE: ${{ matrix.bundle }}
        run: |
          install="$RUNNER_TEMP/install"
          mkdir -p "$install" "$RUNNER_TEMP/smoke"
          cp "out/$BUNDLE.tar.gz" "$install/"
          (cd "$install" && tar -xzf "$BUNDLE.tar.gz")
          test -f "$install/$BUNDLE/lib/app/.github/liftoff/review-policy.mjs"
          cd "$RUNNER_TEMP/smoke"
          export PATH="$install/$BUNDLE/bin:/usr/bin:/bin"
          if command -v node; then echo "node is still on PATH"; exit 1; fi
          liftoff --version
          liftoff capabilities --json > capabilities.json
          liftoff init --name smoke --workflow manual --agents claude --yes
          liftoff validate --dir smoke
          test -f smoke/.github/workflows/01-pr-ci.yml
          test -f smoke/backend/.python-version
          test -f smoke/.gitignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.bundle }}
          path: out/${{ matrix.bundle }}.tar.gz
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.name == 'macOS arm64'
        with:
          name: npm-package
          path: out/voyager163-liftoff-*.tgz
          retention-days: 7
          if-no-files-found: error

  # The cask and the draft core formula, from a local tap, as Homebrew checks
  # and installs them (CHAN-001, CHAN-002). Each is installed from this
  # run's own bundle or package, then removed.
  homebrew:
    name: Homebrew cask and formula
    needs: package
    runs-on: macos-15
    timeout-minutes: 30
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_NO_ANALYTICS: "1"
      TAP: liftoff/ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: liftoff-package-aarch64-apple-darwin
          path: ${{ runner.temp }}/assets
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: ${{ runner.temp }}/assets
      - name: Make a local tap of the cask and formula
        run: |
          brew tap-new --no-git "$TAP"
          brew trust --tap "$TAP"
          tap="$(brew --repository "$TAP")"
          mkdir -p "$tap/Casks" "$tap/Formula"
          assets="$RUNNER_TEMP/assets"
          version="$(node -p 'require("./package.json").version')"
          archive="$assets/liftoff-package-aarch64-apple-darwin.tar.gz"
          tarball="$assets/voyager163-liftoff-$version.tgz"
          sum() { shasum -a 256 "$1" | cut -d' ' -f1; }
          # As released, for style and audit.
          node scripts/release/homebrew.ts render cask "$version" "$(sum "$archive")" > "$RUNNER_TEMP/cask.rb"
          node scripts/release/homebrew.ts render formula "$version" "$(sum "$tarball")" > "$RUNNER_TEMP/formula.rb"
          cp "$RUNNER_TEMP/cask.rb" "$tap/Casks/liftoff.rb"
          cp "$RUNNER_TEMP/formula.rb" "$tap/Formula/liftoff.rb"
          brew style "$TAP"
          brew audit --strict --cask "$TAP/liftoff"
          brew audit --strict --formula "$TAP/liftoff"
          # Installed from this run's files instead.
          node scripts/release/homebrew.ts render cask "$version" "$(sum "$archive")" "file://$archive" > "$tap/Casks/liftoff.rb"
          node scripts/release/homebrew.ts render formula "$version" "$(sum "$tarball")" "file://$tarball" > "$tap/Formula/liftoff.rb"
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Install the cask, run Liftoff, and uninstall it
        run: |
          brew install --cask "$TAP/liftoff"
          node scripts/release/check-homebrew-install.ts homebrew-cask
          brew uninstall --cask "$TAP/liftoff"
          test ! -e "$(brew --prefix)/bin/liftoff"
      - name: Build the formula from the npm package, test it, and uninstall it
        run: |
          brew install --build-from-source --formula "$TAP/liftoff"
          brew test "$TAP/liftoff"
          node scripts/release/check-homebrew-install.ts homebrew-formula
          brew uninstall --formula "$TAP/liftoff"
          test ! -e "$(brew --prefix)/bin/liftoff"

  ci-gate:
    name: ci-gate
    if: always()
    needs: [static, test, generated, services, genai, spec-workflows, infrastructure, package, homebrew]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e '
            const needs = JSON.parse(process.env.RESULTS);
            const names = Object.keys(needs);
            if (names.length === 0) { console.error("no jobs reported"); process.exit(1); }
            let failed = false;
            for (const name of names) {
              const result = needs[name].result;
              console.log(name + ": " + result);
              if (result !== "success") failed = true;
            }
            process.exit(failed ? 1 : 0);
          '
