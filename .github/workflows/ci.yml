name: CI

on:
  workflow_dispatch:
  push:
    branches: [develop, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  qualify-native-bundle:
    name: Runtime-inclusive bundle (macOS ARM64)
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.21.0"
          architecture: arm64
          cache: npm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27.0"
          cache-dependency-path: assets/supported-stack.json
      - name: Select supported npm
        run: npm install --global "npm@12.0.2"
      - name: Install dependencies
        run: npm ci
      - name: Retrieve pinned runtime and historical client
        shell: bash
        run: |
          url="$(node --input-type=module -e 'import inputs from "./distribution/native/inputs.json" with { type: "json" }; console.log(inputs.runtime.url)')"
          curl --fail --location --proto '=https' --proto-redir '=https' --max-time 180 \
            "$url" --output "$RUNNER_TEMP/liftoff-node-runtime.tgz"
          curl --fail --location --proto '=https' --proto-redir '=https' --max-time 60 \
            'https://registry.npmjs.org/@msn-control/liftoff/-/liftoff-0.3.4.tgz' \
            --output "$RUNNER_TEMP/liftoff-historical-0.3.4.tgz"
          printf '%s  %s\n' '05793480c44632b3fc01ac98a4f76a73313d8b273afcb30bde5c22de989d69c0' \
            "$RUNNER_TEMP/liftoff-historical-0.3.4.tgz" | shasum --algorithm 256 --check
      - name: Assemble the development bundle
        run: >-
          npm run build:native -- build
          --runtime-archive "$RUNNER_TEMP/liftoff-node-runtime.tgz"
          --output "$RUNNER_TEMP/liftoff-native-bundle"
      - name: Qualify actual installed behavior
        shell: bash
        run: |
          node scripts/native-release.mjs archive "$RUNNER_TEMP/liftoff-native-bundle" "$RUNNER_TEMP/liftoff-native-archive"
          LIFTOFF_NATIVE_BUNDLE_ROOT="$RUNNER_TEMP/liftoff-native-bundle" \
          LIFTOFF_MAC_MIGRATION_BUNDLE_ROOT="$RUNNER_TEMP/liftoff-native-bundle" \
          LIFTOFF_NATIVE_GO_EXECUTABLE="$(command -v go)" \
          LIFTOFF_NATIVE_PACKAGE_ROOT="$RUNNER_TEMP/liftoff-native-bundle" \
          LIFTOFF_NATIVE_ARCHIVE_ROOT="$RUNNER_TEMP/liftoff-native-archive" \
          LIFTOFF_NATIVE_PROGRAM_RUNTIME_ARCHIVE="$RUNNER_TEMP/liftoff-node-runtime.tgz" \
          npx vitest run tests/native-bundle.test.ts tests/native-bundle-installed.test.ts \
            tests/native-distribution.test.ts tests/native-release-set.test.ts tests/native-package-installed.test.ts \
            tests/mac-migration-package.test.ts tests/mac-migration-preparation.test.ts tests/mac-migration-cask-stage.test.ts \
            --maxWorkers=1 --no-file-parallelism --coverage.enabled=false --allowOnly=false \
            --reporter=default --reporter=json --outputFile.json=qualification/native-bundle.json
          node scripts/native-bundle.mjs verify-report qualification/native-bundle.json
          node scripts/native-package-report.mjs qualification/native-bundle.json "$RUNNER_TEMP/liftoff-native-bundle"
          node scripts/mac-migration-package-report.mjs qualification/native-bundle.json
          journey="$(node scripts/mac-migration-journey-report.mjs select "$RUNNER_TEMP/liftoff-native-bundle")"
          case "$journey" in
            stable-handover) journey_test=tests/mac-migration-journey.test.ts ;;
            prerelease-refusal) journey_test=tests/mac-migration-prerelease.test.ts ;;
            *) printf 'Unsupported migration journey outcome: %s\n' "$journey" >&2; exit 1 ;;
          esac
          journey_report="qualification/mac-migration-${journey}.json"
          LIFTOFF_MAC_MIGRATION_BUNDLE_ROOT="$RUNNER_TEMP/liftoff-native-bundle" \
          LIFTOFF_MAC_MIGRATION_HISTORICAL_TARBALL="$RUNNER_TEMP/liftoff-historical-0.3.4.tgz" \
          npx vitest run "$journey_test" \
            --maxWorkers=1 --no-file-parallelism --coverage.enabled=false --allowOnly=false \
            --reporter=default --reporter=json --outputFile.json="$journey_report"
          node scripts/mac-migration-journey-report.mjs "$journey_report" "$RUNNER_TEMP/liftoff-native-bundle" "$journey" \
            > "qualification/mac-migration-${journey}-outcome.json"
          LIFTOFF_NATIVE_PROGRAM_RUNTIME_ARCHIVE="$RUNNER_TEMP/liftoff-node-runtime.tgz" \
          npx vitest run tests/workflow-source5-program-content.test.ts \
            --maxWorkers=1 --no-file-parallelism --coverage.enabled=false --allowOnly=false \
            --reporter=default --reporter=json --outputFile.json=qualification/workflow-program-content.json
          node scripts/check-repository-policy.mjs --workflow-program-report qualification/workflow-program-content.json
      - name: Store development qualification evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: liftoff-native-bundle-ci-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            qualification/native-bundle.json
            qualification/mac-migration-*.json
            qualification/workflow-program-content.json
            ${{ runner.temp }}/liftoff-native-bundle/bundle.json
            ${{ runner.temp }}/liftoff-native-archive/
          if-no-files-found: error
          retention-days: 14

  qualify-native-platform-packages:
    name: Native development package (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x64
          - os: ubuntu-24.04-arm
            target: linux-arm64
          - os: windows-2025
            target: win32-x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.21.0"
          cache: npm
      - name: Select supported npm
        run: npm install --global "npm@12.0.2"
      - name: Install dependencies
        run: npm ci
      - name: Compile the native Windows launcher
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do call "%%i\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
          cl /nologo /W4 /WX /O2 /MT /Fo:"%RUNNER_TEMP%\liftoff-launcher.obj" /Fe:"%RUNNER_TEMP%\liftoff-launcher.exe" distribution\windows\launcher.c /link /SUBSYSTEM:CONSOLE
      - name: Select the pinned Windows interop compiler
        if: runner.os == 'Windows'
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: "10.0.402"
      - name: Verify the packaged Windows interop against two independent builds
        if: runner.os == 'Windows'
        shell: bash
        run: |
          npm run --silent check:windows-interop > "$RUNNER_TEMP/liftoff-windows-job-interop.json"
      - name: Retrieve the pinned platform runtime
        shell: bash
        run: |
          url="$(node --input-type=module -e 'import inputs from "./distribution/native/inputs.json" with { type: "json" }; import { nativeRuntimeInput } from "./scripts/native-bundle-contract.mjs"; console.log(nativeRuntimeInput(inputs, {platform:process.platform,architecture:process.arch}).url)')"
          curl --fail --location --proto '=https' --proto-redir '=https' --max-time 180 \
            "$url" --output "$RUNNER_TEMP/liftoff-platform-runtime"
      - name: Prepare pinned Linux qualification userspace
        if: runner.os == 'Linux'
        shell: bash
        run: |
          image="$(node --input-type=module -e 'import { nativeLinuxUserspaceImages } from "./scripts/native-package-report.mjs"; console.log(nativeLinuxUserspaceImages[process.arch])')"
          docker pull "$image"
      - name: Build and qualify the isolated native package
        shell: bash
        run: |
          launcher=()
          if [ "$RUNNER_OS" = Windows ]; then launcher=(--windows-launcher "$RUNNER_TEMP/liftoff-launcher.exe"); fi
          npm run build:native -- build --runtime-archive "$RUNNER_TEMP/liftoff-platform-runtime" \
            --output "$RUNNER_TEMP/liftoff-native-bundle" "${launcher[@]}"
          node scripts/native-release.mjs archive "$RUNNER_TEMP/liftoff-native-bundle" "$RUNNER_TEMP/liftoff-native-archive"
          if [ "$RUNNER_OS" = Linux ]; then export LIFTOFF_NATIVE_DOCKER_EXECUTABLE="$(command -v docker)"; fi
          LIFTOFF_NATIVE_PACKAGE_ROOT="$RUNNER_TEMP/liftoff-native-bundle" \
          LIFTOFF_NATIVE_ARCHIVE_ROOT="$RUNNER_TEMP/liftoff-native-archive" \
          npx vitest run tests/native-bundle.test.ts tests/native-distribution.test.ts tests/native-release-set.test.ts tests/native-package-installed.test.ts \
            --maxWorkers=1 --no-file-parallelism --coverage.enabled=false --allowOnly=false \
            --reporter=default --reporter=json --outputFile.json=qualification/native-platform-package.json
          node scripts/native-package-report.mjs qualification/native-platform-package.json "$RUNNER_TEMP/liftoff-native-bundle"
      - name: Store exact-source native development artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: liftoff-native-package-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            qualification/native-platform-package.json
            ${{ runner.temp }}/liftoff-windows-job-interop.json
            ${{ runner.temp }}/liftoff-native-bundle/bundle.json
            ${{ runner.temp }}/liftoff-native-archive/
          if-no-files-found: error
          retention-days: 14

  qualify-linux-kvm-kernel:
    name: Linux x64 kernel floor (KVM diagnostic)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    env:
      DO_NOT_TRACK: "1"
      LIFTOFF_TELEMETRY: "0"
      OPENSPEC_TELEMETRY: "0"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.21.0"
          cache: npm
      - name: Select supported npm and install dependencies
        run: |
          npm install --global "npm@12.0.2"
          npm ci
      - name: Verify source-inventory refusal controls
        run: python3 -m unittest discover -s tests -p linux_kernel_source_test.py -v
      - name: Prepare explicit ephemeral-runner KVM access
        shell: bash
        run: |
          mkdir -m 700 "$RUNNER_TEMP/liftoff-kvm-kernel"
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y qemu-system-x86 acl
          dpkg-query -W qemu-system-x86 acl > "$RUNNER_TEMP/liftoff-kvm-kernel/host-packages.stdout"
          qemu-system-x86_64 --version > "$RUNNER_TEMP/liftoff-kvm-kernel/host-qemu-version.stdout"
          qemu-system-x86_64 -accel help > "$RUNNER_TEMP/liftoff-kvm-kernel/host-qemu-accelerators.stdout"
          node --input-type=module <<'NODE'
          import { lstat, readFile, readlink, writeFile } from 'node:fs/promises';
          import os from 'node:os';
          import { assertLinuxKernelKvmHost, assertLinuxKernelKvmEmulator, linuxKernelKvmDeviceIdentity } from './scripts/native-linux-kernel.mjs';
          assertLinuxKernelKvmHost(process.platform, process.arch, 'x64');
          const directory = process.env.RUNNER_TEMP + '/liftoff-kvm-kernel/';
          const info = await lstat('/dev/kvm', { bigint: true });
          await writeFile(directory + 'device-before-access.json', JSON.stringify({
            host: { platform: process.platform, architecture: process.arch, nativeArchitecture: os.machine(),
              kernel: os.release(), uid: process.getuid(), gid: process.getgid(),
              mountNamespace: await readlink('/proc/self/ns/mnt') },
            characterDevice: info.isCharacterDevice(), device: info
          }, (key, value) => typeof value === 'bigint' ? value.toString() : value, 2) + '\n', { flag: 'wx' });
          assertLinuxKernelKvmEmulator(await readFile(directory + 'host-qemu-version.stdout', 'utf8'),
            await readFile(directory + 'host-qemu-accelerators.stdout', 'utf8'));
          linuxKernelKvmDeviceIdentity(info);
          NODE
          getfacl --absolute-names /dev/kvm > "$RUNNER_TEMP/liftoff-kvm-kernel/device-before-access.stdout"
          udevadm info --query=property --name=/dev/kvm > "$RUNNER_TEMP/liftoff-kvm-kernel/device-before-access-udev.stdout"
          kvm_gid="$(stat --format=%g /dev/kvm)"
          [[ "$kvm_gid" =~ ^[1-9][0-9]*$ ]]
          test "$kvm_gid" = "$(getent group kvm | cut -d: -f3)"
          sudo --non-interactive --preserve-env=DO_NOT_TRACK,LIFTOFF_TELEMETRY,OPENSPEC_TELEMETRY,HOME -- /bin/bash scripts/native-linux-kvm-namespace.sh "$(id -u)" "$kvm_gid" "$(command -v node)" --input-type=module - "$RUNNER_TEMP/liftoff-kvm-kernel" <<'NODE'
          import assert from 'node:assert/strict';
          import { readFile, readlink, writeFile } from 'node:fs/promises';
          import { captureLinuxKernelKvmDevice } from './scripts/native-linux-kernel.mjs';
          const directory = process.argv[2];
          const before = JSON.parse(await readFile(directory + '/device-before-access.json', 'utf8'));
          assert.notEqual(process.getuid(), 0, 'KVM device capture must not execute as root.');
          assert.equal(process.getuid(), before.host.uid, 'KVM preparation must retain the invoking user.');
          const mountNamespace = await readlink('/proc/self/ns/mnt');
          assert.notEqual(mountNamespace, before.host.mountNamespace, 'KVM capture requires a private mount namespace.');
          const device = await captureLinuxKernelKvmDevice();
          assert.equal(String(process.getgid()), device.gid, 'KVM preparation requires the existing device group.');
          await writeFile(directory + '/device-after-access.json',
            JSON.stringify(device, null, 2) + '\n', { flag: 'wx' });
          await writeFile(directory + '/execution-identity.json', JSON.stringify({
            uid: process.getuid(), gid: process.getgid(), groups: process.getgroups(),
            mountNamespace, deviceScope: 'private-mount-namespace'
          }, null, 2) + '\n', { flag: 'wx' });
          NODE
      - name: Authenticate the original Linux 4.18 source before extraction
        shell: bash
        run: |
          directory="$RUNNER_TEMP/liftoff-kvm-kernel"
          curl --fail --location --proto '=https' --proto-redir '=https' --max-time 180 \
            https://cdn.kernel.org/pub/linux/kernel/v4.x/linux-4.18.tar.xz --output "$directory/linux-4.18.tar.xz"
          curl --fail --location --proto '=https' --proto-redir '=https' --max-time 60 \
            https://cdn.kernel.org/pub/linux/kernel/v4.x/linux-4.18.tar.sign --output "$directory/linux-4.18.tar.sign"
          printf '%s  %s\n' 19d8bcf49ef530cd4e364a45b4a22fa70714b70349c8100e7308488e26f1eaf1 "$directory/linux-4.18.tar.xz" \
            82c1cf7265d4b873f152216c199f33e7accc728e226837be69c0d62a5b1a798f "$directory/linux-4.18.tar.sign" \
            | sha256sum --check > "$directory/download-checks.stdout"
          mkdir -m 700 "$RUNNER_TEMP/liftoff-kvm-gnupg"
          timeout --signal=TERM --kill-after=5s 60s gpg --batch --homedir "$RUNNER_TEMP/liftoff-kvm-gnupg" \
            --auto-key-locate clear,wkd --locate-keys torvalds@kernel.org \
            > "$directory/key-discovery.stdout" 2> "$directory/key-discovery.stderr"
          gpg --batch --homedir "$RUNNER_TEMP/liftoff-kvm-gnupg" --with-colons \
            --fingerprint ABAF11C65A2970B130ABE3C479BE3E4300411886 > "$directory/key-fingerprint.stdout"
          timeout 60s xz --decompress --keep "$directory/linux-4.18.tar.xz"
          gpg --batch --homedir "$RUNNER_TEMP/liftoff-kvm-gnupg" --status-fd 1 \
            --verify "$directory/linux-4.18.tar.sign" "$directory/linux-4.18.tar" \
            > "$directory/signature-status.stdout" 2> "$directory/signature-status.stderr"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';
          const status = await readFile(process.env.RUNNER_TEMP + '/liftoff-kvm-kernel/signature-status.stdout', 'utf8');
          assert.doesNotMatch(status, /\[GNUPG:\] (?:BADSIG|ERRSIG|REVKEYSIG|EXPSIG|EXPKEYSIG|NO_PUBKEY|NODATA|FAILURE)\b/);
          const signatures = status.split(/\r?\n/).filter(line => line.startsWith('[GNUPG:] VALIDSIG '));
          assert.equal(signatures.length, 1);
          assert.equal(signatures[0].split(' ').at(-1), 'ABAF11C65A2970B130ABE3C479BE3E4300411886');
          NODE
          sha256sum "$directory/linux-4.18.tar" > "$directory/authenticated-source.sha256"
          tar -xOf "$directory/linux-4.18.tar" linux-4.18/COPYING > "$directory/kernel-COPYING"
          cp scripts/check-linux-kernel-source.py "$directory/check-linux-kernel-source.py"
          cp scripts/native-linux-kvm-namespace.sh "$directory/native-linux-kvm-namespace.sh"
          cp distribution/linux/qualification/Kernel.Dockerfile "$directory/Kernel.Dockerfile"
          cp .github/workflows/ci.yml "$directory/ci-workflow.yml"
          sha256sum scripts/check-linux-kernel-source.py scripts/native-linux-kvm-namespace.sh distribution/linux/qualification/Kernel.Dockerfile \
            > "$directory/builder-source.sha256"
      - name: Build the exact floor in a bounded case-sensitive compiler container
        shell: bash
        run: |
          directory="$RUNNER_TEMP/liftoff-kvm-kernel"
          image="liftoff-kvm-kernel:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          timeout --signal=TERM --kill-after=10s 600s docker build --tag "$image" \
            --file distribution/linux/qualification/Kernel.Dockerfile distribution/linux/qualification \
            > "$directory/compiler-build.stdout" 2> "$directory/compiler-build.stderr"
          docker image inspect "$image" > "$directory/compiler-image.json"
          docker run --rm --network=none --read-only --cap-drop=ALL --security-opt=no-new-privileges \
            "$image" rpm -qa > "$directory/compiler-packages.stdout"
          docker run --rm --network=none --read-only --cap-drop=ALL --security-opt=no-new-privileges \
            "$image" gcc --version > "$directory/compiler-version.stdout"
          grep -E '^gcc \(GCC\) 8\.5\.0([[:space:]]|$)' "$directory/compiler-version.stdout"
          mkdir -m 700 "$directory/output"
          nonce="$(node --input-type=module -e 'import { randomUUID } from "node:crypto"; console.log(randomUUID())')"
          printf '%s\n' "$nonce" > "$directory/compiler-nonce.stdout"
          timeout --signal=TERM --kill-after=10s 1500s docker run --rm --cidfile "$directory/compiler.cid" \
            --label "liftoff.kernel-build.invocation=$nonce" --network=none --read-only --cap-drop=ALL \
            --security-opt=no-new-privileges --pids-limit=256 --cpus=4 --memory=6g \
            --user "$(id -u):$(id -g)" --env HOME=/build --env TMPDIR=/build/tmp --env LANG=C --env LC_ALL=C \
            --tmpfs /build:rw,nosuid,nodev,exec,size=4294967296,mode=1777 \
            --mount "type=bind,source=$directory,target=/inputs,readonly" \
            --mount "type=bind,source=$directory/output,target=/output" "$image" /bin/bash -euxo pipefail -c '
              mkdir /build/source /build/output /build/tmp
              tar --no-same-owner --same-permissions -xf /inputs/linux-4.18.tar -C /build/source
              source_sha="$(cut -d " " -f 1 /inputs/authenticated-source.sha256)"
              python3 /inputs/check-linux-kernel-source.py /inputs/linux-4.18.tar /build/source/linux-4.18 "$source_sha" /output/source-before.json
              make -C /build/source/linux-4.18 O=/build/output ARCH=x86 defconfig
              /build/source/linux-4.18/scripts/config --file /build/output/.config \
                --disable MODULES --disable DEBUG_INFO --disable LOCALVERSION_AUTO \
                --enable VIRTIO_PCI --enable HW_RANDOM_VIRTIO
              make -C /build/source/linux-4.18 O=/build/output ARCH=x86 olddefconfig
              grep -Fx CONFIG_HW_RANDOM_VIRTIO=y /build/output/.config
              grep -Fx CONFIG_VIRTIO_PCI=y /build/output/.config
              timeout --signal=TERM --kill-after=10s 1200s make -C /build/source/linux-4.18 O=/build/output ARCH=x86 -j4 bzImage
              python3 /inputs/check-linux-kernel-source.py /inputs/linux-4.18.tar /build/source/linux-4.18 "$source_sha" /output/source-after.json
              cmp /output/source-before.json /output/source-after.json
              cp /build/output/.config /output/kernel.config
              cp /build/output/arch/x86/boot/bzImage /output/kernel
              sha256sum /output/kernel /output/kernel.config > /output/kernel-subjects.sha256
            ' > "$directory/compiler.stdout" 2> "$directory/compiler.stderr"
      - name: Assemble this exact source and execute its archive on actual KVM
        shell: bash
        run: |
          image="$(node --input-type=module -e 'import { nativeLinuxUserspaceImages } from "./scripts/native-package-report.mjs"; console.log(nativeLinuxUserspaceImages.x64)')"
          docker pull "$image"
          url="$(node --input-type=module -e 'import inputs from "./distribution/native/inputs.json" with { type: "json" }; import { nativeRuntimeInput } from "./scripts/native-bundle-contract.mjs"; console.log(nativeRuntimeInput(inputs, {platform:"linux",architecture:"x64"}).url)')"
          curl --fail --location --proto '=https' --proto-redir '=https' --max-time 180 \
            "$url" --output "$RUNNER_TEMP/liftoff-kvm-runtime"
          npm run build:native -- build --runtime-archive "$RUNNER_TEMP/liftoff-kvm-runtime" \
            --output "$RUNNER_TEMP/liftoff-kvm-bundle"
          node scripts/native-release.mjs archive "$RUNNER_TEMP/liftoff-kvm-bundle" "$RUNNER_TEMP/liftoff-kvm-archive"
          manifest_sha="$(sha256sum "$RUNNER_TEMP/liftoff-kvm-archive/native-release.json" | cut -d ' ' -f 1)"
          kernel_sha="$(sha256sum "$RUNNER_TEMP/liftoff-kvm-kernel/output/kernel" | cut -d ' ' -f 1)"
          kvm_gid="$(node --input-type=module -e 'import { readFileSync } from "node:fs"; console.log(JSON.parse(readFileSync(process.env.RUNNER_TEMP + "/liftoff-kvm-kernel/device-after-access.json")).gid)')"
          [[ "$kvm_gid" =~ ^[1-9][0-9]*$ ]]
          test "$kvm_gid" = "$(getent group kvm | cut -d: -f3)"
          sudo --non-interactive --preserve-env=DO_NOT_TRACK,LIFTOFF_TELEMETRY,OPENSPEC_TELEMETRY,HOME -- /bin/bash scripts/native-linux-kvm-namespace.sh "$(id -u)" "$kvm_gid" "$(command -v node)" scripts/native-linux-kernel.mjs "$RUNNER_TEMP/liftoff-kvm-archive" "$manifest_sha" "$(git rev-parse HEAD)" \
            "$RUNNER_TEMP/liftoff-kvm-kernel/output/kernel" "$kernel_sha" "$RUNNER_TEMP/liftoff-kvm-observation" \
            --kernel-version 4.18.0 --kvm-qemu "$(command -v qemu-system-x86_64)"
      - name: Settle only the invocation-owned compiler container
        if: ${{ always() }}
        shell: bash
        run: |
          directory="$RUNNER_TEMP/liftoff-kvm-kernel"
          if [ -f "$directory/compiler.cid" ]; then
            id="$(cat "$directory/compiler.cid")"
            [[ "$id" =~ ^[a-f0-9]{64}$ ]]
            listed="$(docker container ls --all --no-trunc --filter "id=$id" --format '{{.ID}}')"
            if [ -n "$listed" ]; then
              test "$listed" = "$id"
              docker container inspect "$id" > "$directory/compiler-cleanup.json"
              node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';
          const directory = process.env.RUNNER_TEMP + '/liftoff-kvm-kernel/';
          const [container] = JSON.parse(await readFile(directory + 'compiler-cleanup.json', 'utf8'));
          const [image] = JSON.parse(await readFile(directory + 'compiler-image.json', 'utf8'));
          assert.equal(container.Id, (await readFile(directory + 'compiler.cid', 'utf8')).trim());
          assert.equal(container.Image, image.Id);
          assert.equal(container.Config.Labels['liftoff.kernel-build.invocation'],
            (await readFile(directory + 'compiler-nonce.stdout', 'utf8')).trim());
          NODE
              docker rm --force "$id"
            fi
          fi
          id > "$directory/device-after-execution.stdout"
          getfacl --absolute-names /dev/kvm > "$directory/device-after-execution-acl.stdout"
          udevadm info --query=property --name=/dev/kvm > "$directory/device-after-execution-udev.stdout"
          node --input-type=module - "$directory" <<'NODE'
          import { lstat, writeFile } from 'node:fs/promises';
          const info = await lstat('/dev/kvm', { bigint: true });
          await writeFile(process.argv[2] + '/device-after-execution.json', JSON.stringify({
            characterDevice: info.isCharacterDevice(), device: info
          }, (key, value) => typeof value === 'bigint' ? value.toString() : value, 2) + '\n', { flag: 'wx' });
          NODE
      - name: Retain actual kernel, source, archive and execution evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: liftoff-linux-kvm-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/liftoff-kvm-kernel/*.stdout
            ${{ runner.temp }}/liftoff-kvm-kernel/*.stderr
            ${{ runner.temp }}/liftoff-kvm-kernel/*.json
            ${{ runner.temp }}/liftoff-kvm-kernel/*.sha256
            ${{ runner.temp }}/liftoff-kvm-kernel/linux-4.18.tar.sign
            ${{ runner.temp }}/liftoff-kvm-kernel/linux-4.18.tar.xz
            ${{ runner.temp }}/liftoff-kvm-kernel/kernel-COPYING
            ${{ runner.temp }}/liftoff-kvm-kernel/check-linux-kernel-source.py
            ${{ runner.temp }}/liftoff-kvm-kernel/native-linux-kvm-namespace.sh
            ${{ runner.temp }}/liftoff-kvm-kernel/Kernel.Dockerfile
            ${{ runner.temp }}/liftoff-kvm-kernel/ci-workflow.yml
            ${{ runner.temp }}/liftoff-kvm-kernel/output/
            ${{ runner.temp }}/liftoff-kvm-archive/
            ${{ runner.temp }}/liftoff-kvm-observation/*.json
            ${{ runner.temp }}/liftoff-kvm-observation/*.stdout
            ${{ runner.temp }}/liftoff-kvm-observation/*.stderr
            ${{ runner.temp }}/liftoff-kvm-observation/init
            ${{ runner.temp }}/liftoff-kvm-observation/guest-probe.mjs
            ${{ runner.temp }}/liftoff-kvm-observation/Dockerfile
          if-no-files-found: error
          retention-days: 14

  qualify-isolated-hcl:
    name: Isolated HCL parser (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-15
            architecture: arm64
          - target: linux-x64
            runner: ubuntu-24.04
            architecture: x64
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            architecture: arm64
    permissions:
      contents: read
    env:
      LIFTOFF_HCL_TEST_LANE: native
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.21.0"
          architecture: ${{ matrix.architecture }}
          cache: npm
      - name: Select supported npm
        run: npm install --global "npm@12.0.2"
      - name: Install dependencies
        run: npm ci
      - name: Require qualified parser runtime
        run: node scripts/check-repository-policy.mjs --hcl-runtime
      - name: Run required native parser qualification
        run: >-
          npx vitest run tests/modern-local-inputs.test.ts tests/modern-local-check-plans.test.ts tests/isolated-hcl-parser.test.ts
          --maxWorkers=1 --no-file-parallelism --reporter=default --reporter=json --outputFile.json=qualification/isolated-hcl.json
      - name: Verify nonempty complete parser qualification
        run: node scripts/check-repository-policy.mjs --hcl-report qualification/isolated-hcl.json
      - name: Store parser qualification evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: liftoff-isolated-hcl-ci-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: qualification/isolated-hcl.json
          if-no-files-found: error
          retention-days: 14

  test:
    name: Test (${{ matrix.os }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ always() }}
    needs: test-shards
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Require every platform shard
        env:
          SHARD_RESULT: ${{ needs.test-shards.result }}
        run: test "$SHARD_RESULT" = success

  test-shards:
    name: Platform tests (${{ matrix.os }}, shard ${{ matrix.shard }}/4)
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'windows-latest' && matrix.shard == 2 && 75 || 45 }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            services/telemetry-ingest/package-lock.json

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14.7"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27.0"
          cache-dependency-path: assets/supported-stack.json

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2
        with:
          tofu_version: 1.12.6
          tofu_wrapper: false

      - name: Install uv
        run: python -m pip install uv==0.12.7

      - name: Select supported npm
        run: npm install --global "npm@12.0.2"

      - name: Prepare pinned Linux Docker and Compose
        if: runner.os == 'Linux'
        run: node scripts/prepare-ci-local-tools.mjs

      - name: Prepare pinned macOS Docker and Compose
        if: runner.os == 'macOS'
        run: node scripts/prepare-ci-local-tools.mjs

      - name: Prefer the selected npm distribution on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $prefix = (npm prefix --global).Trim()
          if ($LASTEXITCODE -ne 0) { throw "Unable to locate the selected npm prefix." }
          $manifest = Join-Path $prefix "node_modules/npm/package.json"
          $version = (Get-Content -Raw $manifest | ConvertFrom-Json).version
          if ($version -ne "12.0.2") { throw "Expected npm 12.0.2 at the selected prefix; found $version." }
          $prefix | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Prepare pinned Windows Docker and Compose
        if: runner.os == 'Windows'
        run: node scripts/prepare-ci-local-tools.mjs

      - name: Use runner-owned short temporary paths on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "TEMP=$env:RUNNER_TEMP" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TMP=$env:RUNNER_TEMP" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install dependencies
        run: npm ci

      - name: Qualify native plugin paths
        run: >-
          npx vitest run tests/plugin-native-paths.test.ts tests/plugin-packaged-lookup-native.test.ts
          tests/plugin-generation-parity.test.ts tests/plugin-composition.test.ts
          --maxWorkers=1 --no-file-parallelism --coverage.enabled=false --allowOnly=false
          --reporter=dot --reporter=json --outputFile.json=qualification/plugin-paths.json

      - name: Verify complete native plugin path report
        run: node scripts/check-repository-policy.mjs --plugin-path-report qualification/plugin-paths.json

      - name: Store native plugin path evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: liftoff-plugin-paths-${{ runner.os }}-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: qualification/plugin-paths.json
          if-no-files-found: error
          retention-days: 14

      - name: Install telemetry gateway dependencies
        run: npm ci --prefix services/telemetry-ingest

      - name: Install isolated pinned framework smoke tools
        if: runner.os == 'Linux' && matrix.shard == 1
        env:
          UV_TOOL_DIR: ${{ runner.temp }}/liftoff-framework-tools
          UV_TOOL_BIN_DIR: ${{ runner.temp }}/liftoff-framework-bin
        run: |
          npm install --prefix "$RUNNER_TEMP/liftoff-framework-npm" --no-package-lock --ignore-scripts --no-audit --no-fund @fission-ai/openspec@1.11.0
          uv tool install --python python3 specify-cli==1.0.1
          echo "$RUNNER_TEMP/liftoff-framework-npm/node_modules/.bin" >> "$GITHUB_PATH"
          echo "$UV_TOOL_BIN_DIR" >> "$GITHUB_PATH"

      - name: Run pinned framework integration smoke
        if: runner.os == 'Linux' && matrix.shard == 1
        env:
          LIFTOFF_FRAMEWORK_SMOKE: "1"
        run: npx vitest run tests/framework-smoke.test.ts

      - name: Verify native Windows process settlement
        id: windows-process
        if: runner.os == 'Windows' && matrix.shard == 1
        run: >-
          npx vitest run
          tests/windows-job-runner.test.ts tests/repair-preparation.test.ts
          tests/adoption-verification-execution.test.ts
          -t "settles a real native Node command|detects unref descendant|runs exact checks in a disposable copy"
          --maxWorkers=1 --no-file-parallelism --coverage.enabled=false --allowOnly=false
          --reporter=dot --reporter=json --outputFile.json=qualification/windows-process-tests.json

      - name: Store Windows process settlement evidence
        if: ${{ !cancelled() && (steps.windows-process.outcome == 'success' || steps.windows-process.outcome == 'failure') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: liftoff-windows-process-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: qualification/windows-process-tests.json
          if-no-files-found: error
          retention-days: 14

      - name: Run Windows project and packaging boundary coverage
        id: windows-boundary
        if: runner.os == 'Windows' && matrix.shard == 2
        run: >-
          npx vitest run
          tests/init-filesystem.test.ts tests/project-discovery.test.ts
          tests/file-system.test.ts tests/project-lock.test.ts tests/filesystem-recovery.test.ts
          tests/update-preview.test.ts tests/update-approval.test.ts tests/update-inspection.test.ts tests/update-output.test.ts
          tests/update-compatibility.test.ts tests/reviewed-update-transaction.test.ts
          tests/repair-discovery.test.ts tests/repair-infrastructure.test.ts tests/repair-transaction.test.ts tests/repair-command.test.ts
          tests/repair-identity.test.ts tests/repair-approval.test.ts tests/repair-application-command.test.ts
          tests/repair-application.test.ts tests/repair-integrations.test.ts
          tests/repair-workspaces.test.ts tests/repair-framework.test.ts
          tests/current-project-repair.test.ts
          tests/adoption-inventory.test.ts tests/adoption-publication.test.ts
          tests/adoption-transaction.test.ts tests/adopt-command.test.ts
          tests/windows-job-protocol.test.ts tests/windows-job-runner.test.ts
          tests/activation-history.test.ts tests/migration-revalidation.test.ts tests/migration-inspection.test.ts tests/reviewed-update.test.ts
          tests/import-boundaries.test.ts tests/contract.test.ts tests/infrastructure-layout.test.ts
          tests/governance-assessment.test.ts tests/governance-assessment-engine.test.ts tests/governance-assessment-history.test.ts
          tests/process-runner.test.ts tests/terminal.test.ts tests/interactive.test.ts
          tests/openspec-profile.test.ts tests/framework-adapters.test.ts tests/dependabot-config.test.ts
          tests/project-dependencies.test.ts tests/commands.test.ts
          tests/documentation.test.ts tests/repository-policy.test.ts tests/release-artifact.test.ts
          tests/telemetry-contract.test.ts tests/telemetry-config.test.ts tests/telemetry.test.ts
          tests/cli-telemetry.test.ts tests/telemetry-infrastructure.test.ts
          --maxWorkers=1 --no-file-parallelism
          --reporter=default --reporter=json
          --outputFile.json=qualification/windows-boundary-tests.json

      - name: Store Windows boundary test evidence
        if: ${{ !cancelled() && (steps.windows-boundary.outcome == 'success' || steps.windows-boundary.outcome == 'failure') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: liftoff-windows-boundary-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: qualification/windows-boundary-tests.json
          if-no-files-found: error
          retention-days: 14

      - name: Validate local repair with native OpenTofu
        if: matrix.shard == 1
        env:
          LIFTOFF_REPAIR_NATIVE: "1"
        run: npx vitest run tests/repair-command.test.ts -t "native backend-disabled"

      - name: Harden tool permissions
        if: runner.os == 'Linux'
        run: |
          sudo chmod -R o-w /opt/hostedtoolcache 2>/dev/null || true
          chmod -R o-w "$RUNNER_TEMP" 2>/dev/null || true

      - name: Validate locked preparation and framework qualification with native toolchains
        if: runner.os != 'Windows' && matrix.shard == 1
        env:
          LIFTOFF_REPAIR_PREPARATION_NATIVE: "1"
        run: npx vitest run tests/repair-preparation-native.test.ts tests/repair-framework.test.ts

      - name: Run package check
        run: >-
          npm run check:supported-stack && npm run build &&
          npx vitest run --shard=${{ matrix.shard }}/4 --allowOnly=false
          --maxWorkers=2
          --reporter=default --reporter=json --outputFile.json=qualification/platform-tests.json

      - name: Store platform test evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: liftoff-platform-tests-${{ runner.os }}-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: qualification/platform-tests.json
          if-no-files-found: error
          retention-days: 14

      - name: Run telemetry gateway check
        if: matrix.shard == 1
        run: npm run check --prefix services/telemetry-ingest

      - name: Run package smoke test
        if: matrix.shard == 1
        run: npm run smoke:package

      - name: Verify generated containers
        if: runner.os == 'Linux' && matrix.shard == 1
        run: npm run verify:generated-containers

  coverage-cli:
    name: CLI coverage gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            services/telemetry-ingest/package-lock.json

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14.7"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27.0"
          cache-dependency-path: assets/supported-stack.json

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2
        with:
          tofu_version: 1.12.6
          tofu_wrapper: false

      - name: Install uv
        run: python -m pip install uv==0.12.7

      - name: Select supported npm
        run: npm install --global "npm@12.0.2"

      - name: Prepare pinned Linux Docker and Compose
        if: runner.os == 'Linux'
        run: node scripts/prepare-ci-local-tools.mjs

      - name: Prepare pinned macOS Docker and Compose
        if: runner.os == 'macOS'
        run: node scripts/prepare-ci-local-tools.mjs

      - name: Install dependencies
        run: npm ci

      - name: Install telemetry gateway dependencies
        run: npm ci --prefix services/telemetry-ingest

      - name: Run source-complete CLI coverage gate
        run: npm run coverage:cli -- --max-workers 4

      - name: Store CLI coverage evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: liftoff-coverage-cli-${{ github.run_id }}-${{ github.run_attempt }}
          path: coverage/cli/
          if-no-files-found: error
          retention-days: 14

  coverage-gateway:
    name: Telemetry gateway coverage gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.20.0"
          cache: npm
          cache-dependency-path: services/telemetry-ingest/package-lock.json

      - name: Select supported npm
        run: npm install --global "npm@12.0.2"

      - name: Install telemetry gateway dependencies
        run: npm ci --prefix services/telemetry-ingest

      - name: Run source-complete telemetry gateway coverage gate
        run: npm run coverage:gateway

      - name: Store telemetry gateway coverage evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: liftoff-coverage-gateway-${{ github.run_id }}-${{ github.run_attempt }}
          path: coverage/gateway/
          if-no-files-found: error
          retention-days: 14

  telemetry-infrastructure:
    name: Telemetry OpenTofu
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.20.0"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            services/telemetry-ingest/package-lock.json

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2
        with:
          tofu_version: 1.12.6

      - name: Select supported npm
        run: npm install --global "npm@12.0.2"

      - name: Install dependencies
        run: npm ci

      - name: Install and check telemetry gateway
        run: |
          npm ci --prefix services/telemetry-ingest
          npm run check --prefix services/telemetry-ingest

      - name: Build and smoke-test telemetry container
        run: npm run smoke:container --prefix services/telemetry-ingest

      - name: Check telemetry OpenTofu formatting
        run: tofu -chdir=infrastructure/opentofu/telemetry fmt -check

      - name: Initialize telemetry OpenTofu without a backend
        run: tofu -chdir=infrastructure/opentofu/telemetry init -backend=false

      - name: Validate telemetry OpenTofu
        run: tofu -chdir=infrastructure/opentofu/telemetry validate

      - name: Check telemetry infrastructure privacy contract
        run: |
          npm run check:telemetry-dashboards
          npx vitest run tests/telemetry-infrastructure.test.ts tests/telemetry-dashboard.test.ts tests/telemetry-bootstrap.test.ts

      - name: Validate Grafana roots without credentials or backends
        run: |
          tofu -chdir=infrastructure/opentofu/telemetry/grafana fmt -check
          tofu -chdir=infrastructure/opentofu/telemetry/grafana init -backend=false -input=false -lockfile=readonly
          tofu -chdir=infrastructure/opentofu/telemetry/grafana validate
          tofu -chdir=infrastructure/opentofu/telemetry/grafana test -no-color
          tofu -chdir=infrastructure/opentofu/telemetry/dashboards fmt -check
          tofu -chdir=infrastructure/opentofu/telemetry/dashboards init -backend=false -input=false -lockfile=readonly
          tofu -chdir=infrastructure/opentofu/telemetry/dashboards validate
          tofu -chdir=infrastructure/opentofu/telemetry/dashboards test -no-color

  standard-node-templates:
