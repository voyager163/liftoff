name: CI

on:
  workflow_dispatch:
  push:
    branches: [develop, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  qualify-native-bundle:
    name: Runtime-inclusive bundle (macOS ARM64)
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.21.0"
          architecture: arm64
          cache: npm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27.0"
          cache-dependency-path: assets/supported-stack.json
      - name: Select supported npm
        run: npm install --global "npm@12.0.2"
      - name: Install dependencies
        run: npm ci
      - name: Retrieve the pinned standalone runtime
        shell: bash
        run: |
          url="$(node --input-type=module -e 'import inputs from "./distribution/native/inputs.json" with { type: "json" }; console.log(inputs.runtime.url)')"
          curl --fail --location --proto '=https' --proto-redir '=https' --max-time 180 \
            "$url" --output "$RUNNER_TEMP/liftoff-node-runtime.tgz"
      - name: Assemble the development bundle
        run: >-
          npm run build:native -- build
          --runtime-archive "$RUNNER_TEMP/liftoff-node-runtime.tgz"
          --output "$RUNNER_TEMP/liftoff-native-bundle"
      - name: Qualify actual installed behavior
        shell: bash
        run: |
          LIFTOFF_NATIVE_BUNDLE_ROOT="$RUNNER_TEMP/liftoff-native-bundle" \
          LIFTOFF_NATIVE_GO_EXECUTABLE="$(command -v go)" \
          npx vitest run tests/native-bundle.test.ts tests/native-bundle-installed.test.ts \
            --maxWorkers=1 --no-file-parallelism --coverage.enabled=false --allowOnly=false \
            --reporter=default --reporter=json --outputFile.json=qualification/native-bundle.json
          node scripts/native-bundle.mjs verify-report qualification/native-bundle.json
      - name: Store development qualification evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: liftoff-native-bundle-ci-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            qualification/native-bundle.json
            ${{ runner.temp }}/liftoff-native-bundle/bundle.json
          if-no-files-found: error
          retention-days: 14

  qualify-isolated-hcl:
    name: Isolated HCL parser (macOS ARM64)
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      LIFTOFF_HCL_TEST_LANE: native
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.21.0"
          architecture: arm64
          cache: npm
      - name: Select supported npm
        run: npm install --global "npm@12.0.2"
      - name: Install dependencies
        run: npm ci
      - name: Require qualified parser runtime
        run: node scripts/check-repository-policy.mjs --hcl-runtime
      - name: Run required native parser qualification
        run: >-
          npx vitest run tests/modern-local-inputs.test.ts tests/modern-local-check-plans.test.ts tests/isolated-hcl-parser.test.ts
          --maxWorkers=1 --no-file-parallelism --reporter=default --reporter=json --outputFile.json=qualification/isolated-hcl.json
      - name: Verify nonempty complete parser qualification
        run: node scripts/check-repository-policy.mjs --hcl-report qualification/isolated-hcl.json
      - name: Store parser qualification evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: liftoff-isolated-hcl-ci-${{ github.run_id }}-${{ github.run_attempt }}
          path: qualification/isolated-hcl.json
          if-no-files-found: error
          retention-days: 14

  test:
    name: Test (${{ matrix.os }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ always() }}
    needs: test-shards
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Require every platform shard
        env:
          SHARD_RESULT: ${{ needs.test-shards.result }}
        run: test "$SHARD_RESULT" = success

  test-shards:
    name: Platform tests (${{ matrix.os }}, shard ${{ matrix.shard }}/2)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.20.0"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            services/telemetry-ingest/package-lock.json

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14.7"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27.0"
          cache-dependency-path: assets/supported-stack.json

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2
        with:
          tofu_version: 1.12.6
          tofu_wrapper: false

      - name: Install uv
        run: python -m pip install uv==0.12.7

      - name: Select supported npm
        run: npm install --global "npm@12.0.2"

      - name: Prefer the selected npm distribution on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $prefix = (npm prefix --global).Trim()
          if ($LASTEXITCODE -ne 0) { throw "Unable to locate the selected npm prefix." }
          $manifest = Join-Path $prefix "node_modules/npm/package.json"
          $version = (Get-Content -Raw $manifest | ConvertFrom-Json).version
          if ($version -ne "12.0.2") { throw "Expected npm 12.0.2 at the selected prefix; found $version." }
          $prefix | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Use runner-owned short temporary paths on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "TEMP=$env:RUNNER_TEMP" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TMP=$env:RUNNER_TEMP" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install dependencies
        run: npm ci

      - name: Qualify native plugin paths
        run: >-
          npx vitest run tests/plugin-native-paths.test.ts tests/plugin-packaged-lookup-native.test.ts
          tests/plugin-generation-parity.test.ts tests/plugin-composition.test.ts
          --maxWorkers=1 --no-file-parallelism --coverage.enabled=false --allowOnly=false
          --reporter=dot --reporter=json --outputFile.json=qualification/plugin-paths.json

      - name: Verify complete native plugin path report
        run: node scripts/check-repository-policy.mjs --plugin-path-report qualification/plugin-paths.json

      - name: Store native plugin path evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: liftoff-plugin-paths-${{ runner.os }}-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: qualification/plugin-paths.json
          if-no-files-found: error
          retention-days: 14

      - name: Install telemetry gateway dependencies
        run: npm ci --prefix services/telemetry-ingest

      - name: Install isolated pinned framework smoke tools
        if: runner.os == 'Linux' && matrix.shard == 1
        env:
          UV_TOOL_DIR: ${{ runner.temp }}/liftoff-framework-tools
          UV_TOOL_BIN_DIR: ${{ runner.temp }}/liftoff-framework-bin
        run: |
          npm install --prefix "$RUNNER_TEMP/liftoff-framework-npm" --no-package-lock --ignore-scripts --no-audit --no-fund @fission-ai/openspec@1.11.0
          uv tool install --python python3 specify-cli==1.0.1
          echo "$RUNNER_TEMP/liftoff-framework-npm/node_modules/.bin" >> "$GITHUB_PATH"
          echo "$UV_TOOL_BIN_DIR" >> "$GITHUB_PATH"

      - name: Run pinned framework integration smoke
        if: runner.os == 'Linux' && matrix.shard == 1
        env:
          LIFTOFF_FRAMEWORK_SMOKE: "1"
        run: npx vitest run tests/framework-smoke.test.ts

      - name: Verify native Windows controller admission
        if: runner.os == 'Windows' && matrix.shard == 1
        run: npx vitest run tests/windows-job-runner.test.ts tests/repair-preparation.test.ts -t "settles a real native Node command|detects unref descendant"

      - name: Run Windows project and packaging boundary coverage
        if: runner.os == 'Windows' && matrix.shard == 2
        run: >-
          npx vitest run
          tests/init-filesystem.test.ts tests/project-discovery.test.ts
          tests/file-system.test.ts tests/project-lock.test.ts tests/filesystem-recovery.test.ts
          tests/update-preview.test.ts tests/update-approval.test.ts tests/update-inspection.test.ts tests/update-output.test.ts
          tests/update-compatibility.test.ts tests/reviewed-update-transaction.test.ts
          tests/repair-discovery.test.ts tests/repair-infrastructure.test.ts tests/repair-transaction.test.ts tests/repair-command.test.ts
          tests/repair-identity.test.ts tests/repair-approval.test.ts tests/repair-application-command.test.ts
          tests/repair-application.test.ts tests/repair-integrations.test.ts
          tests/repair-workspaces.test.ts tests/repair-framework.test.ts
          tests/windows-job-protocol.test.ts tests/windows-job-runner.test.ts
          tests/activation-history.test.ts tests/migration-revalidation.test.ts tests/migration-inspection.test.ts tests/reviewed-update.test.ts
          tests/import-boundaries.test.ts tests/contract.test.ts tests/infrastructure-layout.test.ts
          tests/governance-assessment.test.ts tests/governance-assessment-engine.test.ts tests/governance-assessment-history.test.ts
          tests/process-runner.test.ts tests/terminal.test.ts tests/interactive.test.ts
          tests/openspec-profile.test.ts tests/framework-adapters.test.ts tests/dependabot-config.test.ts
          tests/project-dependencies.test.ts tests/commands.test.ts
          tests/documentation.test.ts tests/repository-policy.test.ts tests/release-artifact.test.ts
          tests/telemetry-contract.test.ts tests/telemetry-config.test.ts tests/telemetry.test.ts
          tests/cli-telemetry.test.ts tests/telemetry-infrastructure.test.ts

      - name: Validate local repair with native OpenTofu
        if: matrix.shard == 1
        env:
          LIFTOFF_REPAIR_NATIVE: "1"
        run: npx vitest run tests/repair-command.test.ts -t "native backend-disabled"

      - name: Harden tool permissions
        if: runner.os == 'Linux'
        run: |
          sudo chmod -R o-w /opt/hostedtoolcache 2>/dev/null || true
          chmod -R o-w "$RUNNER_TEMP" 2>/dev/null || true

      - name: Validate locked preparation and framework qualification with native toolchains
        if: runner.os != 'Windows' && matrix.shard == 1
        env:
          LIFTOFF_REPAIR_PREPARATION_NATIVE: "1"
        run: npx vitest run tests/repair-preparation-native.test.ts tests/repair-framework.test.ts

      - name: Run package check
        run: >-
          npm run check:supported-stack && npm run build &&
          npx vitest run --shard=${{ matrix.shard }}/2 --allowOnly=false
          --reporter=default --reporter=json --outputFile.json=qualification/platform-tests.json

      - name: Store platform test evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: liftoff-platform-tests-${{ runner.os }}-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: qualification/platform-tests.json
          if-no-files-found: error
          retention-days: 14

      - name: Run telemetry gateway check
        if: matrix.shard == 1
        run: npm run check --prefix services/telemetry-ingest

      - name: Run package smoke test
        if: matrix.shard == 1
        run: npm run smoke:package

      - name: Verify generated containers
        if: runner.os == 'Linux' && matrix.shard == 1
        run: npm run verify:generated-containers

  coverage-cli:
    name: CLI coverage gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.20.0"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            services/telemetry-ingest/package-lock.json

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14.7"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27.0"
          cache-dependency-path: assets/supported-stack.json

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2
        with:
          tofu_version: 1.12.6
          tofu_wrapper: false

      - name: Install uv
        run: python -m pip install uv==0.12.7

      - name: Select supported npm
        run: npm install --global "npm@12.0.2"

      - name: Install dependencies
        run: npm ci

      - name: Install telemetry gateway dependencies
        run: npm ci --prefix services/telemetry-ingest

      - name: Run source-complete CLI coverage gate
        run: npm run coverage:cli

      - name: Store CLI coverage evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: liftoff-coverage-cli-${{ github.run_id }}-${{ github.run_attempt }}
          path: coverage/cli/
          if-no-files-found: error
          retention-days: 14

  coverage-gateway:
    name: Telemetry gateway coverage gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.20.0"
          cache: npm
          cache-dependency-path: services/telemetry-ingest/package-lock.json

      - name: Select supported npm
        run: npm install --global "npm@12.0.2"

      - name: Install telemetry gateway dependencies
        run: npm ci --prefix services/telemetry-ingest

      - name: Run source-complete telemetry gateway coverage gate
        run: npm run coverage:gateway

      - name: Store telemetry gateway coverage evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: liftoff-coverage-gateway-${{ github.run_id }}-${{ github.run_attempt }}
          path: coverage/gateway/
          if-no-files-found: error
          retention-days: 14

  telemetry-infrastructure:
    name: Telemetry OpenTofu
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.20.0"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            services/telemetry-ingest/package-lock.json

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2
        with:
          tofu_version: 1.12.6

      - name: Select supported npm
        run: npm install --global "npm@12.0.2"

      - name: Install dependencies
        run: npm ci

      - name: Install and check telemetry gateway
        run: |
          npm ci --prefix services/telemetry-ingest
          npm run check --prefix services/telemetry-ingest

      - name: Build and smoke-test telemetry container
        run: npm run smoke:container --prefix services/telemetry-ingest

      - name: Check telemetry OpenTofu formatting
        run: tofu -chdir=infrastructure/opentofu/telemetry fmt -check

      - name: Initialize telemetry OpenTofu without a backend
        run: tofu -chdir=infrastructure/opentofu/telemetry init -backend=false

      - name: Validate telemetry OpenTofu
        run: tofu -chdir=infrastructure/opentofu/telemetry validate

      - name: Check telemetry infrastructure privacy contract
        run: npx vitest run tests/telemetry-infrastructure.test.ts

  standard-node-templates:
    name: ${{ matrix.check-name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            check-name: Standard Node templates (npm 10.9.4)
            node-version: "22.12.0"
            npm-version: "10.9.4"
          - os: ubuntu-latest
            check-name: Standard Node templates (npm 12.0.2)
            node-version: "24.20.0"
            npm-version: "12.0.2"
          - os: macos-latest
            check-name: Standard Node templates (macos-latest, npm 10.9.4)
            node-version: "22.12.0"
            npm-version: "10.9.4"
          - os: macos-latest
            check-name: Standard Node templates (macos-latest, npm 12.0.2)
            node-version: "24.20.0"
            npm-version: "12.0.2"
          - os: windows-latest
            check-name: Standard Node templates (windows-latest, npm 10.9.4)
            node-version: "22.12.0"
            npm-version: "10.9.4"
          - os: windows-latest
            check-name: Standard Node templates (windows-latest, npm 12.0.2)
            node-version: "24.20.0"
            npm-version: "12.0.2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Select npm compatibility lane
        run: npm install --global "npm@${{ matrix.npm-version }}"

      - name: Prefer the selected npm distribution on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          EXPECTED_NPM_VERSION: ${{ matrix.npm-version }}
        run: |
          $prefix = (npm prefix --global).Trim()
          if ($LASTEXITCODE -ne 0) { throw "Unable to locate the selected npm prefix." }
          $manifest = Join-Path $prefix "node_modules/npm/package.json"
          $version = (Get-Content -Raw $manifest | ConvertFrom-Json).version
          if ($version -ne $env:EXPECTED_NPM_VERSION) { throw "Unexpected npm at the selected prefix: $version." }
          $prefix | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Liftoff dependencies
        env:
          npm_config_engine_strict: "false"
        run: npm ci

      - name: Capture the exact generated-project runtime
        env:
          EXPECTED_PROJECT_NODE: ${{ matrix.node-version }}
          EXPECTED_PROJECT_NPM: ${{ matrix.npm-version }}
        run: node scripts/standard-node-template-runtime.mjs --capture

      - name: Select the supported Liftoff generator runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.20.0"

      - name: Verify standard Node.js templates
        env:
          npm_config_engine_strict: "false"
          LIFTOFF_TEMPLATE_QUALIFICATION_REPORT: ${{ runner.temp }}/standard-node-templates.json
        run: npm run verify:standard-node-templates

      - name: Store actual generated-project qualification
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: liftoff-node-templates-${{ matrix.os }}-npm${{ matrix.npm-version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/standard-node-templates.json
          if-no-files-found: error
          retention-days: 14
