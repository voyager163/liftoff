# Scores the verified AI review pipeline against known cases in
# evals/review/: seeded and real defects it should catch, and clean changes
# where any Important finding is a false positive. Run nightly and whenever
# its prompts, skills or model change, so changes are measured, not assumed.
name: Review evals

on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  COPILOT_CLI: "@github/copilot@1.0.98"
  LIFTOFF_REVIEW_DIR: ai-review

jobs:
  cases:
    name: List cases
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      cases: ${{ steps.list.outputs.cases }}
      count: ${{ steps.list.outputs.count }}
      configured: ${{ steps.list.outputs.configured }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: evals/review
      - id: list
        env:
          CONFIGURED: ${{ secrets.COPILOT_GITHUB_TOKEN != '' }}
        run: |
          cases=$(find evals/review -mindepth 1 -maxdepth 1 -type d | sort | jq -R . | jq -sc .)
          {
            echo "cases=$cases"
            echo "count=$(echo "$cases" | jq length)"
            echo "configured=$CONFIGURED"
          } >> "$GITHUB_OUTPUT"
          if [ "$CONFIGURED" != "true" ]; then
            echo "Review evals not run: add a COPILOT_GITHUB_TOKEN repository secret to enable them." >> "$GITHUB_STEP_SUMMARY"
          fi

  evaluate:
    name: Evaluate ${{ matrix.case }}
    needs: cases
    if: needs.cases.outputs.configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        case: ${{ fromJSON(needs.cases.outputs.cases) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Apply the case as one commit on top of develop
        env:
          CASE: ${{ matrix.case }}
        run: |
          git apply --index "$CASE/change.patch"
          git -c user.name=liftoff-eval -c user.email=eval@liftoff.invalid commit --quiet -m "Evaluation change"
      - name: Install the review agent
        run: npm install --global "$COPILOT_CLI"
      - name: Find, verify and score
        env:
          LIFTOFF_EVAL_CASE: ${{ matrix.case }}
          LIFTOFF_BASE_REF: develop
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          LIFTOFF_REVIEW_MODEL: ${{ vars.LIFTOFF_REVIEW_MODEL }}
        run: |
          node .github/liftoff/ai-review.mjs eval-prepare
          for prompt in ai-review/finder-*.md; do
            name=$(basename "$prompt" .md)
            bash .github/liftoff/review-agent.sh "$prompt" "ai-review/finders/$name.txt"
          done
          node .github/liftoff/ai-review.mjs verifier-prompt
          if [ -f ai-review/verifier.md ]; then
            for run in 0 1 2; do
              bash .github/liftoff/review-agent.sh ai-review/verifier.md "ai-review/verifiers/verifier-$run.txt"
            done
          fi
          node .github/liftoff/ai-review.mjs eval-score
          mkdir -p eval-result
          cp ai-review/score.json "eval-result/$(basename "$LIFTOFF_EVAL_CASE").json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eval-${{ strategy.job-index }}
          path: eval-result/
          retention-days: 30
          if-no-files-found: error

  report:
    name: Report
    needs: [cases, evaluate]
    if: always() && needs.cases.outputs.configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/liftoff
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: eval-*
          path: eval-results/
          merge-multiple: true
      - name: Summarise
        env:
          LIFTOFF_EVAL_RESULTS: eval-results
          LIFTOFF_EVAL_EXPECTED: ${{ needs.cases.outputs.count }}
        run: node .github/liftoff/ai-review.mjs eval-report
