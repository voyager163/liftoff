name: Release Liftoff

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run all release checks without publishing to npm
        required: true
        default: true
        type: boolean
  push:
    tags:
      - v*

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish @msn-control/liftoff
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.20.0"
          registry-url: https://registry.npmjs.org
          cache: npm

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14.7"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27.0"
          cache-dependency-path: src/standard-templates.ts

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2
        with:
          tofu_version: 1.12.6

      - name: Install uv
        run: python -m pip install uv==0.12.7

      - name: Select supported npm
        run: npm install --global "npm@12.0.2"

      - name: Install dependencies
        run: npm ci

      - name: Run package check
        run: npm run check

      - name: Run package smoke test
        run: npm run smoke:package

      - name: Verify standard Node.js templates
        run: npm run verify:standard-node-templates

      - name: Inspect publish package
        run: npm pack --dry-run --json

      - name: Verify release identity
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          if [[ -n "$RELEASE_TAG" ]]; then
            npm run verify:release-identity -- "$RELEASE_TAG"
          else
            npm run verify:release-identity
          fi

      - name: Select npm dist-tag
        id: dist-tag
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [[ "$version" == *-* ]]; then
            echo "tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run == false }}
        run: npm publish --access public --provenance --tag "${{ steps.dist-tag.outputs.tag }}"

      - name: Verify published package from canonical npm
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run == false }}
        run: npm run verify:published -- "${{ steps.dist-tag.outputs.tag }}"
