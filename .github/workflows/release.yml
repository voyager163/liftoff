name: Release Liftoff

on:
  workflow_dispatch:
  push:
    tags:
      - v*

permissions:
  contents: read

concurrency:
  group: release-liftoff-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  qualify:
    name: Qualify release artifact
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      sha256: ${{ steps.bundle.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.20.0"
          cache: npm

      - name: Verify release ref
        run: node scripts/release-artifact.mjs check-ref

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14.7"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27.0"
          cache-dependency-path: assets/supported-stack.json

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2
        with:
          tofu_version: 1.12.6
          tofu_wrapper: false

      - name: Install uv
        run: python -m pip install uv==0.12.7

      - name: Select supported npm
        run: npm install --global "npm@12.0.2"

      - name: Install dependencies
        run: npm ci

      - name: Run package check
        run: npm run check

      - name: Run package smoke test
        run: npm run smoke:package

      - name: Verify standard Node.js templates
        run: npm run verify:standard-node-templates

      - name: Inspect publish package
        run: npm pack --dry-run --json

      - name: Verify release identity
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          if [[ -n "$RELEASE_TAG" ]]; then
            npm run verify:release-identity -- "$RELEASE_TAG"
          else
            npm run verify:release-identity
          fi

      - name: Pack the qualified artifact
        id: bundle
        run: npm run prepare:release -- "$RUNNER_TEMP/liftoff-release"

      - name: Smoke-test the exact release tarball
        env:
          RELEASE_FILENAME: ${{ steps.bundle.outputs.filename }}
        run: npm run smoke:package -- --tarball "$RUNNER_TEMP/liftoff-release/$RELEASE_FILENAME"

      - name: Store qualified artifact
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: liftoff-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/liftoff-release/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish @msn-control/liftoff
    needs: qualify
    if: ${{ github.event_name == 'push' && github.repository == 'voyager163/liftoff' && github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v') }}
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.20.0"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Select supported npm
        run: npm install --global "npm@12.0.2"

      - name: Download the qualified artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.qualify.outputs.artifact_id }}
          path: ${{ runner.temp }}/liftoff-release/
          merge-multiple: true

      - name: Revalidate release ref and artifact identity
        id: artifact
        env:
          EXPECTED_SHA256: ${{ needs.qualify.outputs.sha256 }}
        run: node scripts/release-artifact.mjs verify "$RUNNER_TEMP/liftoff-release"

      - name: Publish to npm
        env:
          RELEASE_FILENAME: ${{ steps.artifact.outputs.filename }}
          DIST_TAG: ${{ steps.artifact.outputs.dist_tag }}
        run: npm publish "$RUNNER_TEMP/liftoff-release/$RELEASE_FILENAME" --ignore-scripts --access public --provenance --tag "$DIST_TAG"

      - name: Install verification tools without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Verify published package from canonical npm
        env:
          DIST_TAG: ${{ steps.artifact.outputs.dist_tag }}
        run: npm run verify:published -- "$DIST_TAG"
