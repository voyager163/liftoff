name: Validate coordinated native release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Source checks or read-only validation of previously authorized native evidence (never publishes)
        type: choice
        options:
          - source-validation
          - evidence-validation
          - prepare-action
          - approve-action
          - qualify-records
        default: source-validation
        required: true
      source_commit:
        description: Exact reviewed 40-character source SHA; must equal the dispatched ref's current commit
        type: string
        required: true
      evidence_run_id:
        description: Completed registered evidence-collection run ID (required for evidence-validation)
        type: string
      evidence_run_attempt:
        description: Exact evidence run attempt, not an old superseded attempt (required for evidence-validation)
        type: string
      evidence_artifact_id:
        description: Exact public/sanitized evidence artifact ID from that registered run (required for evidence-validation)
        type: string
      approval_purpose:
        description: Only approve-action authorizes this exact artifact's registered scope, effects, cost and time; never merge/deployment reviewer approval
        type: choice
        options:
          - none
          - publication
          - liveQualification
          - dashboard
          - telemetryGateway
        default: none
        required: true

permissions:
  contents: read

concurrency:
  group: native-release-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source:
    name: Source validation (${{ matrix.os }}) — not native qualification
    if: github.repository == 'voyager163/liftoff'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Validate explicit reviewed source selection
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          if [[ ! "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ || "$SOURCE_COMMIT" != "$GITHUB_SHA" ]]; then
            echo "::error::source_commit must be the exact immutable commit of the dispatched ref; no branch/version override is accepted."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.20.0"
          cache: npm

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14.7"

      - name: Install contributor dependencies
        run: npm ci

      - name: Build reviewed source
        run: npm run build

      - name: Verify release identity
        run: node scripts/verify-release-identity.mjs

      - name: Run source-only gate regression tests
        run: npx vitest run tests/release-gate.test.ts tests/release-workflow.test.ts

      - name: Capture source identities and outstanding prerequisites
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: node scripts/collect-release-evidence.mjs capture-source --source-commit "$SOURCE_COMMIT" --output build/source-validation/report.json

      - name: Retain source-only validation report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-validation-${{ matrix.os }}
          path: build/source-validation/report.json
          if-no-files-found: error
          retention-days: 7

  evidence:
    name: Verify final six-target evidence and independent authorities — read only
    needs: source
    if: inputs.mode == 'evidence-validation'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      attestations: read
    steps:
      - name: Require exact external evidence inputs
        env:
          EVIDENCE_RUN_ID: ${{ inputs.evidence_run_id }}
          EVIDENCE_RUN_ATTEMPT: ${{ inputs.evidence_run_attempt }}
          EVIDENCE_ARTIFACT_ID: ${{ inputs.evidence_artifact_id }}
        run: |
          if [[ ! "$EVIDENCE_RUN_ID" =~ ^[1-9][0-9]{0,15}$ || ! "$EVIDENCE_RUN_ATTEMPT" =~ ^[1-9][0-9]?$ || ! "$EVIDENCE_ARTIFACT_ID" =~ ^[1-9][0-9]{0,15}$ ]]; then
            echo "::error::Missing prerequisite: exact completed trusted evidence run, attempt, and artifact IDs. Source-only checks are not signed/native/live/publication evidence."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.20.0"
          cache: npm

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14.7"

      - name: Build source verifier
        run: npm ci && npm run build

      - name: Collect authenticated previously authorized evidence
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          EVIDENCE_RUN_ID: ${{ inputs.evidence_run_id }}
          EVIDENCE_RUN_ATTEMPT: ${{ inputs.evidence_run_attempt }}
          EVIDENCE_ARTIFACT_ID: ${{ inputs.evidence_artifact_id }}
        run: |
          node scripts/collect-release-evidence.mjs collect \
            --source-commit "$SOURCE_COMMIT" \
            --run-id "$EVIDENCE_RUN_ID" \
            --run-attempt "$EVIDENCE_RUN_ATTEMPT" \
            --artifact-id "$EVIDENCE_ARTIFACT_ID" \
            --output build/release-evidence

      - name: Validate coordinated publication release gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-gate.mjs --evidence build/release-evidence/release-evidence.json

      # Signing, disposable live checks, staging/submissions, stable advancement, and
      # announcements require their own registered authority. This workflow performs none.

  produce:
    name: Produce verified release evidence
    needs: source
    if: inputs.mode == 'prepare-action' || inputs.mode == 'approve-action' || inputs.mode == 'qualify-records'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      attestations: write
      id-token: write
    env:
      REPORT_PATH: ${{ inputs.mode == 'qualify-records' && 'build/source-validation/produced/execution-qualification.json' || inputs.mode == 'prepare-action' && format('build/source-validation/produced/approval-request-{0}.json', inputs.approval_purpose) || format('build/source-validation/produced/authority-{0}.json', inputs.approval_purpose) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.20.0"
          cache: npm

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14.7"

      - name: Build reviewed report producers without install hooks
        run: npm ci --ignore-scripts && npx tsc -p tsconfig.json

      - name: Collect the explicitly selected immutable evidence
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          EVIDENCE_RUN_ID: ${{ inputs.evidence_run_id }}
          EVIDENCE_RUN_ATTEMPT: ${{ inputs.evidence_run_attempt }}
          EVIDENCE_ARTIFACT_ID: ${{ inputs.evidence_artifact_id }}
        run: |
          node scripts/collect-release-evidence.mjs collect \
            --source-commit "$SOURCE_COMMIT" \
            --run-id "$EVIDENCE_RUN_ID" \
            --run-attempt "$EVIDENCE_RUN_ATTEMPT" \
            --artifact-id "$EVIDENCE_ARTIFACT_ID" \
            --output build/release-evidence

      - name: Produce exact request, action receipt, or verified execution aggregate
        env:
          GH_TOKEN: ${{ github.token }}
          LIFTOFF_RELEASE_MODE: ${{ inputs.mode }}
          LIFTOFF_APPROVAL_PURPOSE: ${{ inputs.approval_purpose }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          EVIDENCE_RUN_ID: ${{ inputs.evidence_run_id }}
          EVIDENCE_RUN_ATTEMPT: ${{ inputs.evidence_run_attempt }}
          EVIDENCE_ARTIFACT_ID: ${{ inputs.evidence_artifact_id }}
        run: |
          args=(
            "$LIFTOFF_RELEASE_MODE"
            --source-commit "$SOURCE_COMMIT"
            --evidence build/release-evidence/release-evidence.json
            --run-id "$EVIDENCE_RUN_ID"
            --run-attempt "$EVIDENCE_RUN_ATTEMPT"
            --artifact-id "$EVIDENCE_ARTIFACT_ID"
          )
          if [[ "$LIFTOFF_RELEASE_MODE" != "qualify-records" ]]; then
            args+=(--purpose "$LIFTOFF_APPROVAL_PURPOSE")
          fi
          node scripts/produce-release-evidence.mjs "${args[@]}"

      - name: Attest only the successfully verified report bytes
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.REPORT_PATH }}

      - name: Retain the exact signed report input
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-produced-evidence
          path: ${{ env.REPORT_PATH }}
          if-no-files-found: error
          retention-days: 7

      # These producers do not invoke provider executors. qualify-records verifies
      # previously authorized, independently attested execution measurements.
